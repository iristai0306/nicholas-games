<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SHADOW CLASH — Fighting Game</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#08070d;
              font-family:'Trebuchet MS',system-ui,sans-serif; color:#fff; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }

  /* ---------------- TOUCH PAD ---------------- */
  .pad { position:fixed; bottom:0; left:0; right:0; padding:12px 14px 18px;
         display:none; justify-content:space-between; pointer-events:none; z-index:10; }
  .pad.show { display:flex; }
  .side { display:flex; gap:12px; align-items:flex-end; pointer-events:none; }
  .btn { pointer-events:auto; width:74px; height:74px; border-radius:50%;
         background:rgba(255,255,255,.10); border:2px solid rgba(255,255,255,.35);
         color:#fff; font-size:26px; font-weight:bold; display:flex; align-items:center;
         justify-content:center; user-select:none; backdrop-filter:blur(6px);
         transition:transform .05s, background .05s; }
  .btn:active, .btn.on { background:rgba(255,255,255,.38); transform:scale(.92); }
  .btn.small { width:62px; height:62px; font-size:15px; }
  .btn.punch { background:rgba(80,170,255,.28); border-color:rgba(120,200,255,.9); }
  .btn.kick  { background:rgba(255,90,90,.28);  border-color:rgba(255,140,140,.9); font-size:15px; }
  .btn.block { background:rgba(255,215,80,.25); border-color:rgba(255,225,120,.9); font-size:15px; }
  .btn.jump  { background:rgba(120,255,180,.22); border-color:rgba(150,255,200,.9); }

  /* ---------------- OVERLAYS ---------------- */
  .overlay { position:fixed; inset:0; z-index:30; display:none; align-items:center; justify-content:center;
             background:radial-gradient(circle at 50% 30%, rgba(60,20,90,.92), rgba(6,5,12,.97));
             padding:20px; overflow-y:auto; }
  .overlay.show { display:flex; }

  .panel { width:min(560px, 94vw); text-align:center; animation:pop .25s ease-out; }
  @keyframes pop { from{transform:scale(.94); opacity:0;} to{transform:scale(1); opacity:1;} }

  .logo { font-size:clamp(40px,11vw,76px); font-weight:bold; letter-spacing:2px; line-height:.95;
          background:linear-gradient(180deg,#fff2b0,#ffb03a 55%,#ff5c3a);
          -webkit-background-clip:text; background-clip:text; color:transparent;
          text-shadow:0 6px 0 rgba(120,20,60,.5); margin-bottom:2px; }
  .tagline { color:rgba(255,255,255,.6); font-size:14px; letter-spacing:3px; margin-bottom:22px; text-transform:uppercase; }

  .rowtitle { text-align:left; font-size:12px; letter-spacing:2px; color:#ffb03a;
              margin:16px 0 7px; text-transform:uppercase; font-weight:bold; }
  .seg { display:flex; gap:8px; }
  .seg button { flex:1; padding:13px 6px; border-radius:12px; cursor:pointer;
                border:2px solid rgba(255,255,255,.18); background:rgba(255,255,255,.06);
                color:#fff; font-size:15px; font-weight:bold; font-family:inherit;
                transition:.12s; }
  .seg button:hover { background:rgba(255,255,255,.13); }
  .seg button.sel { border-color:#ffb03a; background:linear-gradient(180deg,rgba(255,176,58,.35),rgba(255,90,60,.25));
                    box-shadow:0 0 16px rgba(255,176,58,.35); }
  .seg button:disabled { opacity:.32; cursor:not-allowed; }

  .ctrls { text-align:left; background:rgba(0,0,0,.35); border:1px solid rgba(255,255,255,.1);
           border-radius:12px; padding:12px 16px; margin-top:18px; font-size:13.5px; line-height:1.7;
           color:rgba(255,255,255,.82); }
  .ctrls b { color:#8ec2ff; }
  .ctrls .k { display:inline-block; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.25);
              border-radius:5px; padding:1px 7px; margin:0 2px; font-size:12px; }

  .startbtn { width:100%; margin-top:22px; padding:20px; border-radius:16px; border:none; cursor:pointer;
              font-family:inherit; font-size:26px; font-weight:bold; letter-spacing:2px; color:#2a0d00;
              background:linear-gradient(180deg,#ffe08a,#ff9d2e 60%,#ff6a2e);
              box-shadow:0 8px 0 #8a3a10, 0 12px 26px rgba(255,120,40,.35);
              transition:transform .06s, box-shadow .06s; }
  .startbtn:active { transform:translateY(5px); box-shadow:0 3px 0 #8a3a10, 0 6px 16px rgba(255,120,40,.3); }
  .minibtn { margin-top:14px; padding:12px; width:100%; border-radius:12px; cursor:pointer;
             font-family:inherit; font-size:16px; font-weight:bold; color:#fff;
             background:rgba(255,255,255,.09); border:2px solid rgba(255,255,255,.22); transition:.12s; }
  .minibtn:hover { background:rgba(255,255,255,.16); }
  .minibtn:active { transform:scale(.97); }

  /* pause button */
  #pauseBtn { position:fixed; top:14px; right:14px; z-index:20; width:46px; height:46px; border-radius:50%;
              display:none; align-items:center; justify-content:center; font-size:19px; cursor:pointer;
              background:rgba(0,0,0,.5); border:2px solid rgba(255,255,255,.35); color:#fff; }
  #pauseBtn.show { display:flex; }

  #hint { position:fixed; bottom:8px; left:50%; transform:translateX(-50%);
          color:rgba(255,255,255,.35); font-size:12px; letter-spacing:1px; z-index:5;
          text-align:center; pointer-events:none; display:none; }
  #hint.show { display:block; }
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>

<!-- ============ TOUCH PAD (mobile mode) ============ -->
<div class="pad" id="pad">
  <div class="side">
    <div class="btn" id="bLeft">◀</div>
    <div class="btn" id="bRight">▶</div>
  </div>
  <div class="side">
    <div class="btn small block" id="bBlock">BLK</div>
    <div class="btn small jump" id="bJump">JMP</div>
    <div class="btn punch" id="bPunch">P</div>
    <div class="btn kick" id="bKick">K</div>
  </div>
</div>
<div id="hint"></div>
<div id="pauseBtn">⏸</div>

<!-- ============ MAIN MENU ============ -->
<div class="overlay show" id="menu">
  <div class="panel">
    <div class="logo">SHADOW<br>CLASH</div>
    <div class="tagline">Choose your battle</div>

    <div class="rowtitle">Control Mode</div>
    <div class="seg" id="segCtrl">
      <button data-ctrl="mobile">📱 Mobile</button>
      <button data-ctrl="pc">🖥️ PC</button>
    </div>

    <div class="rowtitle">Game Mode</div>
    <div class="seg" id="segMode">
      <button data-mode="cpu">🤖 1P vs CPU</button>
      <button data-mode="2p">👥 2 Player</button>
    </div>

    <div class="rowtitle">Difficulty</div>
    <div class="seg" id="segDiff">
      <button data-diff="easy">Easy</button>
      <button data-diff="normal">Normal</button>
      <button data-diff="hard">Hard</button>
    </div>

    <div class="ctrls" id="ctrlHelp"></div>

    <button class="startbtn" id="startBtn">FIGHT ▶</button>
  </div>
</div>

<!-- ============ PAUSE MENU ============ -->
<div class="overlay" id="pause">
  <div class="panel" style="width:min(420px,92vw);">
    <div class="logo" style="font-size:clamp(34px,9vw,56px);">PAUSED</div>
    <button class="minibtn" id="resumeBtn" style="font-size:20px;padding:16px;">▶ Resume</button>
    <button class="minibtn" id="restartBtn">🔄 Restart Match</button>
    <button class="minibtn" id="menuBtn">🏠 Main Menu</button>
  </div>
</div>

<script>
(() => {
"use strict";

/* ============================ SETUP ============================ */
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 960, H = 540;
let viewScale = 1, viewOffX = 0, viewOffY = 0;

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.floor(w * dpr);
  cv.height = Math.floor(h * dpr);
  cv.style.width = w + 'px';
  cv.style.height = h + 'px';
  const scale = Math.min(w / W, h / H);
  viewScale = scale * dpr;
  viewOffX = (w * dpr - W * viewScale) / 2;
  viewOffY = (h * dpr - H * viewScale) / 2;
}
window.addEventListener('resize', resize);
resize();

const IS_TOUCH = (('ontouchstart' in window) || (navigator.maxTouchPoints > 0) ||
                  (window.matchMedia && matchMedia('(pointer: coarse)').matches));

/* ============================ CONSTANTS ============================ */
const GROUND = 452;
const GRAVITY = 2400;
const MOVE_SPEED = 285;
const JUMP_V = -820;
const MAX_HP = 100;
const ROUND_TIME = 60;
const ROUNDS_TO_WIN = 2;

const ATTACKS = {
  punch: { startup:0.07, active:0.08, recovery:0.13, dmg:6,  reach:92,  high:96, low:44, kb:170, hitstun:0.17 },
  kick:  { startup:0.14, active:0.11, recovery:0.26, dmg:11, reach:112, high:108, low:36, kb:360, hitstun:0.32 }
};

const DIFF = {
  easy:   { cdMul:1.7, blockChance:0.18, aggression:0.45, react:0.30, dmgMul:0.8 },
  normal: { cdMul:1.0, blockChance:0.48, aggression:0.72, react:0.55, dmgMul:1.0 },
  hard:   { cdMul:0.62, blockChance:0.75, aggression:0.95, react:0.80, dmgMul:1.15 }
};

/* ============================ GAME OPTIONS ============================ */
const opts = {
  ctrl: IS_TOUCH ? 'mobile' : 'pc',
  mode: 'cpu',
  diff: 'normal'
};

/* ============================ INPUT ============================ */
const keys = {};
window.addEventListener('keydown', e => {
  const block = ['KeyA','KeyD','KeyW','KeyS','KeyJ','KeyK','KeyL','KeyP','Escape',
                 'ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Comma','Period','Space'];
  if (block.includes(e.code)) e.preventDefault();
  keys[e.code] = true;
  if (e.code === 'Escape' || e.code === 'KeyP') togglePause();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function keyController(map) {
  return {
    prev: { jump:false, punch:false, kick:false },
    read() {
      const any = arr => arr.some(c => keys[c]);
      const L = any(map.left), R = any(map.right);
      const jump = any(map.jump), block = any(map.block);
      const punch = any(map.punch), kick = any(map.kick);
      const out = {
        dir: (R?1:0) - (L?1:0),
        block,
        jump:  jump  && !this.prev.jump,
        punch: punch && !this.prev.punch,
        kick:  kick  && !this.prev.kick
      };
      this.prev.jump = jump; this.prev.punch = punch; this.prev.kick = kick;
      return out;
    }
  };
}
const KEYMAP_P1 = { left:['KeyA'], right:['KeyD'], jump:['KeyW'], block:['KeyS','KeyL'], punch:['KeyJ'], kick:['KeyK'] };
const KEYMAP_P2 = { left:['ArrowLeft'], right:['ArrowRight'], jump:['ArrowUp'], block:['ArrowDown'], punch:['Comma'], kick:['Period'] };
const ctrl1 = keyController(KEYMAP_P1);
const ctrl2 = keyController(KEYMAP_P2);

const touch = { left:false, right:false, jump:false, block:false, punch:false, kick:false };
const touchCtrl = {
  prev: { jump:false, punch:false, kick:false },
  read() {
    const t = touch;
    const out = {
      dir: (t.right?1:0) - (t.left?1:0),
      block: t.block,
      jump:  t.jump  && !this.prev.jump,
      punch: t.punch && !this.prev.punch,
      kick:  t.kick  && !this.prev.kick
    };
    this.prev.jump = t.jump; this.prev.punch = t.punch; this.prev.kick = t.kick;
    return out;
  }
};

function bindBtn(id, on, off) {
  const el = document.getElementById(id);
  const press = e => { e.preventDefault(); el.classList.add('on'); on(); };
  const rel   = e => { e.preventDefault(); el.classList.remove('on'); if (off) off(); };
  el.addEventListener('touchstart', press, {passive:false});
  el.addEventListener('touchend', rel, {passive:false});
  el.addEventListener('touchcancel', rel, {passive:false});
  el.addEventListener('mousedown', press);
  el.addEventListener('mouseup', rel);
  el.addEventListener('mouseleave', rel);
}
bindBtn('bLeft',  () => touch.left = true,  () => touch.left = false);
bindBtn('bRight', () => touch.right = true, () => touch.right = false);
bindBtn('bJump',  () => touch.jump = true,  () => touch.jump = false);
bindBtn('bBlock', () => touch.block = true, () => touch.block = false);
bindBtn('bPunch', () => touch.punch = true, () => touch.punch = false);
bindBtn('bKick',  () => touch.kick = true,  () => touch.kick = false);

/* ============================ AUDIO ============================ */
let actx = null;
function beep(freq, dur, type, vol) {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square'; o.frequency.value = freq;
    g.gain.value = vol || 0.05;
    o.connect(g); g.connect(actx.destination);
    o.start();
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.stop(actx.currentTime + dur);
  } catch(e) {}
}

/* ============================ FIGHTER ============================ */
class Fighter {
  constructor(o) {
    this.name = o.name;
    this.colors = o.colors;
    this.ctrl = o.ctrl || 'ai';
    this.reset(o.x, o.facing);
  }
  reset(x, facing) {
    this.x = x; this.y = GROUND;
    this.vx = 0; this.vy = 0;
    this.facing = facing;
    this.hp = MAX_HP;
    this.onGround = true;
    this.state = 'idle';
    this.attack = null;
    this.attackT = 0;
    this.hasHit = false;
    this.hitstun = 0;
    this.blocking = false;
    this.animT = 0;
    this.flash = 0;
    this.walkPhase = 0;
    this.aiDir = 0; this.wantJump = false; this.wantPunch = false; this.wantKick = false; this.aiBlock = false;
    this.aiT = 0; this.aiDecision = 'wait'; this.aiCooldown = 0.4;
  }
  get bodyH() { return 152; }
  hurtbox() {
    const w = 62, h = this.bodyH;
    return { x: this.x - w/2, y: this.y - h, w: w, h: h };
  }
  attackBox() {
    if (!this.attack || this.state !== 'attack') return null;
    const a = ATTACKS[this.attack];
    if (this.attackT < a.startup || this.attackT > a.startup + a.active) return null;
    const reach = a.reach;
    const x = this.facing === 1 ? this.x + 14 : this.x - 14 - reach;
    return { x: x, y: this.y - a.high, w: reach, h: a.high - a.low };
  }
  startAttack(kind) {
    if (this.state === 'attack' || this.hitstun > 0) return;
    this.state = 'attack';
    this.attack = kind;
    this.attackT = 0;
    this.hasHit = false;
    beep(kind === 'punch' ? 380 : 300, 0.06, 'square', 0.035);
  }
  update(dt, opp, intent) {
    intent = intent || { dir:0, block:false, jump:false, punch:false, kick:false };
    if (this.flash > 0) this.flash -= dt;
    this.animT += dt;

    if (this.hitstun > 0) { this.hitstun -= dt; this.state = 'hit'; }

    this.vy += GRAVITY * dt;
    this.y += this.vy * dt;
    if (this.y >= GROUND) { this.y = GROUND; this.vy = 0; this.onGround = true; }
    else this.onGround = false;

    if (this.hitstun > 0) {
      /* no control */
    } else if (this.state === 'attack') {
      this.attackT += dt;
      const a = ATTACKS[this.attack];
      if (this.attackT >= a.startup + a.active + a.recovery) { this.state = 'idle'; this.attack = null; }
    } else {
      this.blocking = this.onGround && intent.block;
      if (this.blocking) {
        this.state = 'block';
        this.vx *= 0.7;
      } else {
        const dir = intent.dir;
        if (dir !== 0) {
          this.vx = dir * MOVE_SPEED;
          this.state = 'walk';
          this.walkPhase += dt * 11;
        } else {
          this.vx *= this.onGround ? 0.55 : 0.92;
          this.state = this.onGround ? 'idle' : 'air';
        }
        if (this.onGround && intent.jump) {
          this.vy = JUMP_V; this.onGround = false; this.state = 'air';
          beep(520, 0.09, 'sine', 0.03);
        }
        if (intent.punch) this.startAttack('punch');
        if (intent.kick)  this.startAttack('kick');
      }
      if (this.onGround && this.state !== 'attack') {
        const d = opp.x - this.x;
        if (Math.abs(d) > 6) this.facing = d > 0 ? 1 : -1;
      }
    }

    this.x += this.vx * dt;
    if (this.state !== 'walk' || this.hitstun > 0) this.vx *= (this.onGround ? 0.82 : 0.96);
    this.x = Math.max(60, Math.min(W - 60, this.x));
  }

  draw(ctx) {
    const c = this.colors, dir = this.facing, x = this.x, y = this.y, t = this.animT;
    let lean = Math.max(-0.12, Math.min(0.12, this.vx / 2400));
    const hipY = y - 72, shoulderY = y - 126, headY = y - 146;
    let bob = 0;
    if (this.state === 'idle') bob = Math.sin(t * 4) * 2.5;
    if (this.state === 'walk') bob = Math.abs(Math.sin(this.walkPhase)) * 4;

    ctx.save();
    if (this.flash > 0) ctx.globalAlpha = 0.85;
    const hitLean = this.hitstun > 0 ? -dir * 0.22 : 0;

    // legs
    let legFrontAngle = 0, legBackAngle = 0;
    if (this.state === 'walk') {
      legFrontAngle = Math.sin(this.walkPhase) * 0.5;
      legBackAngle = -Math.sin(this.walkPhase) * 0.5;
    } else if (!this.onGround) { legFrontAngle = -0.5; legBackAngle = 0.35; }
    if (this.state === 'attack' && this.attack === 'kick') {
      const a = ATTACKS.kick;
      if (this.attackT < a.startup + a.active) legFrontAngle = -1.35;
    }
    const legLen = 72, hipX = x;
    drawLimb(ctx, hipX, hipY + bob, hipX + Math.sin(legFrontAngle) * legLen, y, c.pants, 15);
    drawLimb(ctx, hipX, hipY + bob, hipX - Math.sin(legBackAngle) * legLen * 0.85, y, c.pantsDark, 15);

    // torso
    const shX = x + lean * 30 + hitLean * 30;
    ctx.strokeStyle = c.gi; ctx.lineWidth = 34; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(hipX, hipY + bob); ctx.lineTo(shX, shoulderY + bob); ctx.stroke();
    ctx.strokeStyle = c.belt; ctx.lineWidth = 9;
    ctx.beginPath(); ctx.moveTo(hipX - 15, hipY + bob - 6); ctx.lineTo(hipX + 15, hipY + bob - 6); ctx.stroke();

    // head
    const headX = shX + lean * 6 + hitLean * 8;
    ctx.fillStyle = c.skin; circle(ctx, headX, headY + bob, 17); ctx.fill();
    ctx.strokeStyle = c.band; ctx.lineWidth = 7; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(headX - 16, headY + bob - 5); ctx.lineTo(headX + 16, headY + bob - 5); ctx.stroke();
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(headX - dir * 15, headY + bob - 6);
    ctx.lineTo(headX - dir * 15 - dir * 16, headY + bob - 2 + Math.sin(t * 8) * 5);
    ctx.stroke();
    ctx.fillStyle = '#12131a';
    ctx.beginPath(); ctx.arc(headX + dir * 7, headY + bob + 1, 2.6, 0, 7); ctx.fill();

    // arms
    const armLen = 62;
    let frontArmA = 0.5, backArmA = 0.5, extend = 0;
    if (this.state === 'block') { frontArmA = -1.5; backArmA = -1.4; }
    else if (this.state === 'attack' && this.attack === 'punch') {
      const a = ATTACKS.punch;
      if (this.attackT < a.startup) extend = 0.4;
      else if (this.attackT < a.startup + a.active) extend = 1.0;
      else extend = 0.45;
    } else if (this.state === 'walk') {
      frontArmA = -0.5 + Math.sin(this.walkPhase) * 0.35;
      backArmA = 0.7 - Math.sin(this.walkPhase) * 0.35;
    } else if (this.state === 'hit') { frontArmA = -0.9; backArmA = -0.6; }

    const shFrontX = shX + dir * 12, shFrontY = shoulderY + bob + 6;
    const shBackX = shX - dir * 8, shBackY = shoulderY + bob + 10;

    if (this.attack === 'punch' && this.state === 'attack' && extend > 0) {
      const reach = ATTACKS.punch.reach * extend;
      const fx = shFrontX + dir * reach, fy = shFrontY;
      drawLimb(ctx, shFrontX, shFrontY, fx, fy, c.skin, 13);
      ctx.fillStyle = c.glove; circle(ctx, fx, fy, 10); ctx.fill();
      drawLimb(ctx, shBackX, shBackY, shBackX - dir * 6, shBackY + 46, c.skin, 12);
    } else if (this.state === 'block') {
      const handX = shFrontX + dir * 26, handY = shFrontY - 24;
      ctx.strokeStyle = c.skin; ctx.lineWidth = 13; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(shFrontX, shFrontY); ctx.lineTo(handX, handY); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(shBackX, shBackY); ctx.lineTo(handX + dir * 6, handY + 6); ctx.stroke();
      ctx.fillStyle = c.glove; circle(ctx, handX, handY, 11); ctx.fill();
      ctx.strokeStyle = 'rgba(255,225,120,.35)'; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(x + dir * 30, y - 100, 40, -1.2, 1.2); ctx.stroke();
    } else {
      const hfx = shFrontX + Math.sin(frontArmA) * dir * armLen;
      const hfy = shFrontY + Math.cos(frontArmA) * armLen * 0.8;
      drawLimb(ctx, shFrontX, shFrontY, hfx, hfy, c.skin, 12);
      const hbx = shBackX - Math.sin(backArmA) * dir * armLen * 0.9;
      const hby = shBackY + Math.cos(backArmA) * armLen * 0.8;
      drawLimb(ctx, shBackX, shBackY, hbx, hby, c.skin, 12);
    }

    if (this.state === 'attack' && this.attack === 'kick') {
      const a = ATTACKS.kick;
      if (this.attackT < a.startup + a.active) {
        const kx = hipX + dir * a.reach * 0.92;
        drawLimb(ctx, hipX, hipY + bob, kx, hipY + bob + 6, c.pants, 16);
        ctx.fillStyle = c.shoe; circle(ctx, kx, hipY + bob + 6, 11); ctx.fill();
      }
    }

    if (this.flash > 0) {
      ctx.globalAlpha = Math.min(1, this.flash * 3);
      ctx.fillStyle = '#fff';
      ctx.fillRect(x - 60, y - 165, 120, 170);
    }
    ctx.restore();
  }
}

function drawLimb(ctx, x1, y1, x2, y2, color, w) {
  ctx.strokeStyle = color; ctx.lineWidth = w; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2); ctx.stroke();
}
function circle(ctx, x, y, r) { ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); }

/* ============================ PARTICLES ============================ */
const particles = [];
function spawnHit(x, y, dir, big) {
  const n = big ? 16 : 10;
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y,
      vx: dir * (80 + Math.random() * 260) + (Math.random() - 0.5) * 120,
      vy: -60 + Math.random() * 220 - 90,
      life: 0.28 + Math.random() * 0.28, max: 0.56,
      r: (big ? 4 : 3) + Math.random() * 4,
      col: big ? '#ffd24a' : '#ffffff'
    });
  }
}
function updateParticles(dt) {
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 1500 * dt; p.vx *= 0.97;
    p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
}

/* ============================ FIGHTERS ============================ */
const player = new Fighter({ name:'YOU', ctrl:'keys1', x:280, facing:1, colors:{
  skin:'#e8b48c', gi:'#2b6cff', belt:'#ffffff', pants:'#1e4fd6', pantsDark:'#153ba8',
  band:'#ff3b3b', glove:'#ff3b3b', shoe:'#111'
}});
const enemy = new Fighter({ name:'RIVAL', ctrl:'ai', x:680, facing:-1, colors:{
  skin:'#d99b73', gi:'#e03a3a', belt:'#1a1a1a', pants:'#a01f1f', pantsDark:'#7a1414',
  band:'#111', glove:'#111', shoe:'#111'
}});
let p1label = 'YOU', p2label = 'RIVAL';

/* ============================ STATE ============================ */
let screen = 'menu';         // menu | fight
let phase = 'intro';        // intro | fight | roundend | matchend
let phaseT = 0;
let round = 1, playerWins = 0, enemyWins = 0;
let timer = ROUND_TIME;
let bannerText = 'ROUND 1', bannerSub = '';
let shake = 0, hitStop = 0, paused = false;
let demo = { t: 0 };

const NEUTRAL = { dir:0, block:false, jump:false, punch:false, kick:false };

/* ============================ MATCH FLOW ============================ */
function startMatch() {
  // assign controllers based on options
  if (opts.mode === '2p') {
    player.ctrl = 'keys1';
    enemy.ctrl  = 'keys2';
    p1label = 'P1'; p2label = 'P2';
  } else {
    player.ctrl = (opts.ctrl === 'mobile') ? 'touch' : 'keys1';
    enemy.ctrl  = 'ai';
    p1label = 'YOU'; p2label = 'CPU';
  }
  // reset counters
  for (const k in ctrl1.prev) ctrl1.prev[k] = false;
  for (const k in ctrl2.prev) ctrl2.prev[k] = false;
  for (const k in touchCtrl.prev) touchCtrl.prev[k] = false;
  playerWins = 0; enemyWins = 0; round = 1;
  startRound();
  screen = 'fight'; paused = false;
  document.getElementById('menu').classList.remove('show');
  document.getElementById('pause').classList.remove('show');
  updateChrome();
}

function startRound() {
  player.reset(280, 1);
  enemy.reset(680, -1);
  enemy.aiCooldown = 0.6;
  timer = ROUND_TIME;
  phase = 'intro'; phaseT = 0;
  bannerText = 'ROUND ' + round; bannerSub = 'GET READY';
  particles.length = 0;
  beep(300, 0.15, 'sawtooth', 0.04);
}

function toMenu() {
  screen = 'menu'; paused = false;
  document.getElementById('pause').classList.remove('show');
  document.getElementById('menu').classList.add('show');
  // idle demo positioning
  player.reset(300, 1); enemy.reset(660, -1);
  player.ctrl = 'none'; enemy.ctrl = 'none';
  updateChrome();
}

function togglePause() {
  if (screen !== 'fight') return;
  paused = !paused;
  document.getElementById('pause').classList.toggle('show', paused);
  if (paused) { for (const k in keys) keys[k] = false; Object.assign(touch,{left:false,right:false,jump:false,block:false,punch:false,kick:false}); }
}

/* ============================ COMBAT ============================ */
function resolveHits(a, b) {
  const box = a.attackBox();
  if (!box || a.hasHit) return;
  const hb = b.hurtbox();
  if (box.x < hb.x + hb.w && box.x + box.w > hb.x && box.y < hb.y + hb.h && box.y + box.h > hb.y) {
    a.hasHit = true;
    const def = ATTACKS[a.attack];
    const blocked = b.state === 'block' && ((b.facing === 1 && a.x > b.x) || (b.facing === -1 && a.x < b.x));
    let dmg = def.dmg, kb = def.kb, stun = def.hitstun;
    if (a.ctrl === 'ai') dmg = Math.round(dmg * DIFF[opts.diff].dmgMul);
    if (blocked) { dmg = Math.round(dmg * 0.22); kb *= 0.45; stun *= 0.5; }
    b.hp = Math.max(0, b.hp - dmg);
    b.vx = a.facing * kb;
    b.hitstun = stun;
    b.flash = 0.12;
    b.state = 'hit';
    b.attack = null;
    shake = Math.max(shake, blocked ? 4 : (def.dmg > 8 ? 12 : 7));
    hitStop = blocked ? 0.03 : (def.dmg > 8 ? 0.075 : 0.045);
    spawnHit((a.x + b.x) / 2, b.y - 100, a.facing, def.dmg > 8);
    beep(blocked ? 180 : (def.dmg > 8 ? 140 : 240), 0.08, 'square', blocked ? 0.03 : 0.06);
  }
}

function endRound(winner) {
  if (winner === 'player') playerWins++; else enemyWins++;
  phase = 'roundend'; phaseT = 0;
  const ko = (player.hp <= 0 || enemy.hp <= 0);
  bannerText = ko ? 'K.O.' : 'TIME UP';
  bannerSub = winner === 'player' ? p1label + ' WINS THE ROUND' : p2label + ' WINS THE ROUND';
  beep(ko ? 90 : 200, 0.4, 'sawtooth', 0.06);
}

/* ============================ AI ============================ */
function aiIntent(self, opp) {
  const out = { dir:0, block:false, jump:false, punch:false, kick:false };
  const D = DIFF[opts.diff];
  if (self.hitstun > 0 || self.state === 'attack') return out;

  self.aiCooldown -= 1 / 60;
  const d = opp.x - self.x, ad = Math.abs(d), dirTo = d > 0 ? 1 : -1;

  if (opp.state === 'attack' && ad < 150 && opp.attack) {
    const a = ATTACKS[opp.attack];
    if (opp.attackT < a.startup + 0.04 && Math.random() < D.blockChance) { out.block = true; return out; }
  }

  if (self.aiCooldown <= 0) {
    if (ad < 108) {
      const r = Math.random();
      if (r < 0.45 * D.aggression + 0.2) { out.punch = true; self.aiCooldown = (0.22 + Math.random() * 0.3) * D.cdMul; }
      else if (r < 0.72 * D.aggression + 0.1) { out.kick = true; self.aiCooldown = (0.5 + Math.random() * 0.4) * D.cdMul; }
      else if (r < 0.86) { self.aiDecision = 'retreat'; self.aiCooldown = 0.35 * D.cdMul; }
      else { out.block = true; self.aiCooldown = 0.3 * D.cdMul; }
    } else if (ad < 190) {
      self.aiDecision = Math.random() < 0.7 ? 'approach' : 'wait';
      self.aiCooldown = (0.2 + Math.random() * 0.3) * D.cdMul;
    } else {
      self.aiDecision = Math.random() < 0.85 ? 'approach' : 'wait';
      self.aiCooldown = 0.15 * D.cdMul;
    }
    if (ad > 240 && Math.random() < 0.12 * D.react) { out.jump = true; self.aiDecision = 'approach'; }
  }

  if (self.aiDecision === 'approach') out.dir = dirTo;
  else if (self.aiDecision === 'retreat') out.dir = -dirTo;
  return out;
}

/* ============================ LOOP ============================ */
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;
  if (hitStop > 0) { hitStop -= dt; dt = 0; }
  update(dt);
  render(dt);
  requestAnimationFrame(loop);
}

function update(dt) {
  if (shake > 0) shake = Math.max(0, shake - dt * 60);
  updateParticles(dt);

  if (screen === 'menu') {
    demo.t += dt;
    // idle attract animation
    player.update(dt, enemy, NEUTRAL);
    enemy.update(dt, player, NEUTRAL);
    if (player.hp < MAX_HP || enemy.hp < MAX_HP) { player.hp = MAX_HP; enemy.hp = MAX_HP; }
    return;
  }

  if (paused) return;

  phaseT += dt;

  // build intents
  const i1 = readIntent(player, enemy);
  const i2 = readIntent(enemy, player);

  if (phase === 'intro') {
    player.update(dt, enemy, NEUTRAL); enemy.update(dt, player, NEUTRAL);
    player.vx = 0; enemy.vx = 0;
    if (phaseT > 0.9 && bannerText.indexOf('ROUND') === 0) { bannerText = 'FIGHT!'; bannerSub = ''; beep(660, 0.12, 'square', 0.05); }
    if (phaseT > 1.5) { phase = 'fight'; phaseT = 0; }
    return;
  }

  if (phase === 'fight') {
    player.update(dt, enemy, i1);
    enemy.update(dt, player, i2);
    resolveHits(player, enemy);
    resolveHits(enemy, player);

    const dx = enemy.x - player.x, minD = 52;
    if (Math.abs(dx) < minD && Math.abs(player.y - enemy.y) < 120) {
      const push = (minD - Math.abs(dx)) / 2 * (dx >= 0 ? 1 : -1);
      player.x = Math.max(60, Math.min(W - 60, player.x - push));
      enemy.x  = Math.max(60, Math.min(W - 60, enemy.x + push));
    }

    timer -= dt;
    if (player.hp <= 0) endRound('enemy');
    else if (enemy.hp <= 0) endRound('player');
    else if (timer <= 0) {
      timer = 0;
      if (enemy.hp > player.hp) endRound('enemy');
      else endRound('player');
    }
    return;
  }

  if (phase === 'roundend') {
    player.update(dt, enemy, NEUTRAL); enemy.update(dt, player, NEUTRAL);
    if (phaseT > 2.0) {
      if (playerWins >= ROUNDS_TO_WIN || enemyWins >= ROUNDS_TO_WIN) {
        phase = 'matchend'; phaseT = 0;
        const win = playerWins >= ROUNDS_TO_WIN;
        bannerText = win ? (opts.mode === '2p' ? p1label + ' WINS!' : 'YOU WIN!') : (opts.mode === '2p' ? p2label + ' WINS!' : 'YOU LOSE');
        bannerSub = win ? 'CHAMPION OF THE CLASH' : 'REMATCH?';
        beep(win ? 880 : 120, 0.5, win ? 'square' : 'sawtooth', 0.06);
      } else { round++; startRound(); }
    }
    return;
  }

  if (phase === 'matchend') {
    player.update(dt, enemy, NEUTRAL); enemy.update(dt, player, NEUTRAL);
    if (phaseT > 0.6) {
      let restart = false;
      if (opts.mode === '2p') restart = keys['KeyJ'] && keys['Comma'];
      else if (opts.ctrl === 'mobile') restart = touch.punch || touch.jump;
      else restart = keys['KeyJ'] || keys['KeyW'];
      if (restart) startMatch();
    }
  }
}

function readIntent(f, opp) {
  if (f.ctrl === 'ai') return aiIntent(f, opp);
  if (f.ctrl === 'none') return NEUTRAL;
  if (f.ctrl === 'touch') return touchCtrl.read();
  if (f.ctrl === 'keys1') return ctrl1.read();
  if (f.ctrl === 'keys2') return ctrl2.read();
  return NEUTRAL;
}

/* ============================ RENDER ============================ */
function render() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.fillStyle = '#08070d';
  ctx.fillRect(0, 0, cv.width, cv.height);

  let sx = 0, sy = 0;
  if (shake > 0) { sx = (Math.random() - 0.5) * shake * dpr; sy = (Math.random() - 0.5) * shake * dpr; }
  ctx.setTransform(viewScale, 0, 0, viewScale, viewOffX + sx, viewOffY + sy);

  drawStage();
  enemy.draw(ctx);
  player.draw(ctx);
  drawParticles();
  drawHUD();
}

function drawStage() {
  const g = ctx.createLinearGradient(0, 0, 0, GROUND + 60);
  g.addColorStop(0, '#1b1030'); g.addColorStop(0.5, '#2a1440'); g.addColorStop(1, '#3d1030');
  ctx.fillStyle = g; ctx.fillRect(-40, -40, W + 80, H + 80);

  ctx.fillStyle = 'rgba(255,240,200,.85)'; circle(ctx, 780, 110, 46); ctx.fill();
  ctx.fillStyle = 'rgba(255,240,200,.12)'; circle(ctx, 780, 110, 92); ctx.fill();

  ctx.fillStyle = '#160c24';
  const bl = [[40,300,70],[110,250,55],[165,320,80],[245,270,60],[305,330,75],[380,240,65],[445,300,90],[535,265,60],[595,325,80],[675,250,70],[745,310,85],[830,270,75],[905,320,70]];
  for (const [bx,by,bw] of bl) ctx.fillRect(bx, by, bw, GROUND + 40 - by);
  ctx.fillStyle = 'rgba(255,210,120,.22)';
  for (const [bx,by,bw] of bl)
    for (let wy = by + 14; wy < GROUND - 10; wy += 26)
      for (let wx = bx + 8; wx < bx + bw - 8; wx += 22)
        if ((wx + wy) % 3 === 0) ctx.fillRect(wx, wy, 8, 11);

  ctx.fillStyle = '#0d0a16'; ctx.fillRect(-40, GROUND + 40, W + 80, H);
  ctx.fillStyle = '#241a3a'; ctx.fillRect(-40, GROUND + 40, W + 80, 8);

  const lg = ctx.createLinearGradient(0, GROUND + 30, 0, GROUND + 60);
  lg.addColorStop(0, 'rgba(255,80,140,.35)'); lg.addColorStop(1, 'rgba(255,80,140,0)');
  ctx.fillStyle = lg; ctx.fillRect(-40, GROUND + 32, W + 80, 28);

  ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 3;
  for (let i = 0; i <= 8; i++) {
    const x = i * (W / 8);
    ctx.beginPath(); ctx.moveTo(x, GROUND + 40); ctx.lineTo(x - 30, H); ctx.stroke();
  }
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life / p.max);
    ctx.fillStyle = p.col; circle(ctx, p.x, p.y, p.r); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  if (screen !== 'fight') return;
  const pad = 26, barW = 360, barH = 26, y = 30;
  drawBar(pad, y, barW, barH, player.hp / MAX_HP, '#3b82ff', '#8ec2ff', false);
  drawBar(W - pad - barW, y, barW, barH, enemy.hp / MAX_HP, '#ff3b5c', '#ff9db0', true);

  ctx.font = 'bold 18px Trebuchet MS';
  ctx.textAlign = 'left'; ctx.fillStyle = '#dfefff'; ctx.fillText(p1label, pad, y + barH + 24);
  ctx.textAlign = 'right'; ctx.fillStyle = '#ffdfe6'; ctx.fillText(p2label, W - pad, y + barH + 24);

  for (let i = 0; i < ROUNDS_TO_WIN; i++) {
    drawPip(pad + i * 22, y + barH + 34, i < playerWins, '#3b82ff');
    drawPip(W - pad - i * 22, y + barH + 34, i < enemyWins, '#ff3b5c');
  }

  ctx.textAlign = 'center';
  ctx.font = 'bold 44px Trebuchet MS';
  ctx.fillStyle = timer <= 10 ? '#ff5c5c' : '#fff';
  ctx.fillText(Math.ceil(timer).toString().padStart(2, '0'), W/2, y + 44);
  ctx.font = 'bold 13px Trebuchet MS';
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  ctx.fillText('ROUND ' + round, W/2, y + 22);

  if (phase === 'intro' || phase === 'roundend' || phase === 'matchend') {
    ctx.textAlign = 'center';
    const pop = phase === 'intro' ? Math.min(1, phaseT * 4) : 1;
    const scale = 1 + (1 - Math.min(1, phaseT * 3)) * 0.35;
    ctx.save();
    ctx.translate(W/2, H/2 - 30); ctx.scale(scale, scale); ctx.globalAlpha = pop;
    ctx.font = 'bold 78px Trebuchet MS';
    ctx.lineWidth = 8; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.strokeText(bannerText, 0, 0);
    const bg = ctx.createLinearGradient(0, -60, 0, 30);
    bg.addColorStop(0, '#fff2b0'); bg.addColorStop(1, '#ffb03a');
    ctx.fillStyle = (phase === 'matchend' && /LOSE/.test(bannerText)) ? '#ff7d7d' : bg;
    ctx.fillText(bannerText, 0, 0);
    if (bannerSub) {
      ctx.font = 'bold 22px Trebuchet MS'; ctx.fillStyle = 'rgba(255,255,255,.85)';
      ctx.fillText(bannerSub, 0, 40);
    }
    ctx.restore();
    if (phase === 'matchend' && phaseT > 0.6) {
      ctx.globalAlpha = 0.6 + Math.sin(phaseT * 6) * 0.4;
      ctx.font = 'bold 18px Trebuchet MS'; ctx.fillStyle = '#fff';
      const t = opts.mode === '2p' ? 'TAP READY ON PAD / J + COMMA TO REMATCH' :
                (opts.ctrl === 'mobile' ? 'TAP PUNCH OR JUMP TO REMATCH' : 'PRESS J OR W TO REMATCH');
      ctx.fillText(t, W/2, H/2 + 60);
      ctx.globalAlpha = 1;
    }
  }
}

function drawBar(x, y, w, h, ratio, col, colLight, fromRight) {
  ratio = Math.max(0, Math.min(1, ratio));
  ctx.fillStyle = 'rgba(0,0,0,.55)'; roundRect(x - 4, y - 4, w + 8, h + 8, 8); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.08)'; roundRect(x, y, w, h, 5); ctx.fill();
  const fw = w * ratio, bx = fromRight ? x + (w - fw) : x;
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, colLight); g.addColorStop(1, col);
  ctx.fillStyle = g; roundRect(bx, y, fw, h, 5); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; roundRect(bx, y + 2, fw, h * 0.35, 4); ctx.fill();
}
function drawPip(x, y, filled, col) {
  ctx.beginPath(); ctx.arc(x, y, 7, 0, 7);
  ctx.fillStyle = filled ? col : 'rgba(255,255,255,.15)'; ctx.fill();
  ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 2; ctx.stroke();
}
function roundRect(x, y, w, h, r) {
  if (w < 2*r) r = w/2; if (h < 2*r) r = h/2;
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* ============================ MENU UI ============================ */
const elCtrl = document.getElementById('segCtrl');
const elMode = document.getElementById('segMode');
const elDiff = document.getElementById('segDiff');
const elHelp = document.getElementById('ctrlHelp');

function segSelect(container, attr, value) {
  [...container.querySelectorAll('button')].forEach(b => {
    b.classList.toggle('sel', b.getAttribute(attr) === value);
  });
}
elCtrl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  opts.ctrl = b.getAttribute('data-ctrl'); refreshMenu();
});
elMode.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || b.disabled) return;
  opts.mode = b.getAttribute('data-mode'); refreshMenu();
});
elDiff.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  opts.diff = b.getAttribute('data-diff'); refreshMenu();
});
document.getElementById('startBtn').addEventListener('click', startMatch);
document.getElementById('pauseBtn').addEventListener('click', togglePause);
document.getElementById('resumeBtn').addEventListener('click', togglePause);
document.getElementById('restartBtn').addEventListener('click', () => startMatch());
document.getElementById('menuBtn').addEventListener('click', toMenu);

function refreshMenu() {
  // disable 2P on mobile mode
  const twoP = elMode.querySelector('[data-mode="2p"]');
  if (opts.ctrl === 'mobile') { twoP.disabled = true; if (opts.mode === '2p') opts.mode = 'cpu'; }
  else twoP.disabled = false;

  segSelect(elCtrl, 'data-ctrl', opts.ctrl);
  segSelect(elMode, 'data-mode', opts.mode);
  segSelect(elDiff, 'data-diff', opts.diff);

  const span = k => '<span class="k">' + k + '</span>';
  if (opts.mode === '2p') {
    elHelp.innerHTML =
      '<b>Player 1</b> — ' + span('A') + span('D') + ' move · ' + span('W') + ' jump · ' + span('S') + ' block · ' + span('J') + ' punch · ' + span('K') + ' kick<br>' +
      '<b>Player 2</b> — ' + span('←') + span('→') + ' move · ' + span('↑') + ' jump · ' + span('↓') + ' block · ' + span(',') + ' punch · ' + span('.') + ' kick';
  } else if (opts.ctrl === 'mobile') {
    elHelp.innerHTML =
      'Use the on-screen buttons:<br>' +
      '◀ ▶ move &nbsp;·&nbsp; <b>JMP</b> jump &nbsp;·&nbsp; <b>BLK</b> block &nbsp;·&nbsp; <b>P</b> punch &nbsp;·&nbsp; <b>K</b> kick';
  } else {
    elHelp.innerHTML =
      span('A') + span('D') + ' move &nbsp;·&nbsp; ' + span('W') + ' jump &nbsp;·&nbsp; ' +
      span('J') + ' punch &nbsp;·&nbsp; ' + span('K') + ' kick &nbsp;·&nbsp; ' + span('L') + ' / ' + span('S') + ' block &nbsp;·&nbsp; ' +
      span('Esc') + ' pause';
  }
}

function updateChrome() {
  const fightActive = (screen === 'fight');
  const pad = document.getElementById('pad');
  pad.classList.toggle('show', fightActive && opts.ctrl === 'mobile' && opts.mode !== '2p');
  const hint = document.getElementById('hint');
  hint.classList.toggle('show', fightActive && opts.ctrl === 'pc' && opts.mode !== '2p');
  if (hint.classList.contains('show')) hint.textContent = 'A / D MOVE · W JUMP · J PUNCH · K KICK · S BLOCK · ESC PAUSE';
  document.getElementById('pauseBtn').classList.toggle('show', fightActive);
}

/* ============================ GO ============================ */
refreshMenu();
toMenu();
requestAnimationFrame(loop);
})();
</script>
