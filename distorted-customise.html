<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Distorted — Customise</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    #scanlines {
      position: fixed; top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 999; pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }
    #scanlines::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
    }

    #top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100; flex-shrink: 0;
    }
    #top-bar h1 { font-family: 'Orbitron', monospace; font-size: 18px; letter-spacing: 6px; color: #a0a0cc; }
    #top-bar h1 span { color: #fff; }

    .nav-btn {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 2px;
      color: #8899bb; background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; padding: 6px 18px; cursor: pointer; transition: all 0.2s;
    }
    .nav-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); }

    #confirm-btn {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 700; letter-spacing: 3px;
      color: #fff; background: linear-gradient(135deg, #6c5ce7, #a855f7);
      border: none; border-radius: 8px; padding: 8px 30px; cursor: pointer;
      transition: all 0.2s; box-shadow: 0 0 20px rgba(108,92,231,0.3);
    }
    #confirm-btn:hover { transform: scale(1.04); box-shadow: 0 0 30px rgba(108,92,231,0.5); }

    #main { display: flex; flex: 1; min-height: 0; z-index: 50; }

    #preview-area { flex: 1; position: relative; background: radial-gradient(ellipse at 50% 42%, #1a1a2e 0%, #0a0a12 70%); }
    #preview-canvas { width: 100%; height: 100%; display: block; cursor: grab; touch-action: none; }
    #preview-canvas.grabbing { cursor: grabbing; }

    #preview-name {
      position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
      font-family: 'Orbitron', monospace; font-size: 12px; letter-spacing: 5px;
      color: rgba(255,255,255,0.35); pointer-events: none;
    }
    #hint {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      font-size: 12px; letter-spacing: 2px; color: #667799; pointer-events: none;
      text-align: center; line-height: 1.7;
    }
    #hint b { color: #9aa8c8; font-weight: 600; }
    #view-tools {
      position: absolute; top: 14px; right: 14px; display: flex; flex-direction: column; gap: 8px;
    }
    .tool-btn {
      font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 11.5px; letter-spacing: 1.4px;
      color: #cfe9f5; background: rgba(16,16,26,0.75); backdrop-filter: blur(4px);
      border: 1px solid rgba(255,255,255,0.14); border-radius: 8px; padding: 8px 12px; cursor: pointer;
      min-width: 118px; text-align: center; transition: .16s;
    }
    .tool-btn:hover { border-color: #6c5ce7; color: #fff; background: rgba(108,92,231,0.22); }
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: #0a0a12; z-index: 200; transition: opacity .5s;
      font-family: 'Orbitron', monospace; letter-spacing: 4px; color: #6c7bd0; font-size: 13px;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 42px; height: 42px; border: 3px solid rgba(108,92,231,0.2); border-top-color: #a855f7; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #options-panel {
      width: 360px; background: rgba(255,255,255,0.02);
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 18px 20px 40px; overflow-y: auto; flex-shrink: 0;
    }
    .option-group { margin-bottom: 20px; }
    .option-group h3 {
      font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
      color: #667799; margin-bottom: 10px; padding-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      display: flex; justify-content: space-between; align-items: center;
    }
    .option-group h3 .count { color: #3a4560; letter-spacing: 1px; font-size: 10px; }

    .slider-row { margin-bottom: 13px; }
    .slider-row label { display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 1px; color: #9aa8c8; margin-bottom: 5px; }
    .slider-row label .val { color: #a855f7; font-weight: 700; }
    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.1); outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: linear-gradient(135deg, #6c5ce7, #a855f7); cursor: pointer;
      box-shadow: 0 0 10px rgba(168,85,247,0.6);
    }
    input[type=range]::-moz-range-thumb {
      width: 16px; height: 16px; border: none; border-radius: 50%;
      background: #a855f7; cursor: pointer; box-shadow: 0 0 10px rgba(168,85,247,0.6);
    }

    .swatch-row { display: flex; flex-wrap: wrap; gap: 7px; }
    .swatch {
      width: 32px; height: 32px; border-radius: 8px; border: 2px solid transparent;
      cursor: pointer; transition: all 0.15s;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.active { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.4); transform: scale(1.12); }

    .hair-card {
      width: 50px; height: 50px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.08);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 21px; transition: all 0.15s; background: rgba(255,255,255,0.03);
    }
    .hair-card:hover { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); }
    .hair-card.active { border-color: #6c5ce7; box-shadow: 0 0 16px rgba(108,92,231,0.4); background: rgba(108,92,231,0.12); }

    .option-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .action-row { display: flex; gap: 10px; margin-top: 6px; }
    .action-btn {
      flex: 1; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 12.5px;
      letter-spacing: 1.6px; text-transform: uppercase; padding: 10px; cursor: pointer;
      color: #cfe9f5; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; transition: .18s;
    }
    .action-btn:hover { border-color: #6c5ce7; color: #fff; background: rgba(108,92,231,0.15); }

    #options-panel::-webkit-scrollbar { width: 4px; }
    #options-panel::-webkit-scrollbar-track { background: transparent; }
    #options-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }
  </style>
</head>
<body>

<div id="scanlines"></div>

<div id="top-bar">
  <button id="back-btn" class="nav-btn">← BACK</button>
  <h1><span>//</span> DISTORTED <span>//</span></h1>
  <button id="confirm-btn">CONFIRM</button>
</div>

<div id="main">
  <div id="preview-area">
    <canvas id="preview-canvas"></canvas>
    <div id="hint"><b>DRAG</b> rotate · <b>RIGHT-DRAG / SHIFT-DRAG</b> move · <b>SCROLL</b> zoom (zooms where your cursor is)</div>
    <div id="view-tools">
      <button class="tool-btn" id="view-reset">⟲ RESET VIEW</button>
      <button class="tool-btn" id="view-head">🙂 HEAD</button>
      <button class="tool-btn" id="view-feet">🦶 FEET</button>
      <button class="tool-btn" id="view-full">🧍 FULL BODY</button>
    </div>
    <div id="preview-name">YOUR CHARACTER</div>
    <div id="loading"><div class="spinner"></div>BUILDING YOUR BODY…</div>
  </div>

  <div id="options-panel">
    <div class="option-group">
      <h3>Body</h3>
      <div class="slider-row">
        <label>Height <span class="val" id="v-height">0.50</span></label>
        <input type="range" id="s-height" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Build <span class="val" id="v-build">0.50</span></label>
        <input type="range" id="s-build" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Muscle <span class="val" id="v-muscle">0.50</span></label>
        <input type="range" id="s-muscle" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>

    <div class="option-group">
      <h3>Build Shape</h3>
      <div class="slider-row">
        <label>Shoulders <span class="val" id="v-shoulders">0.50</span></label>
        <input type="range" id="s-shoulders" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Chest <span class="val" id="v-chest">0.50</span></label>
        <input type="range" id="s-chest" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Waist <span class="val" id="v-waist">0.50</span></label>
        <input type="range" id="s-waist" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Hips <span class="val" id="v-hips">0.50</span></label>
        <input type="range" id="s-hips" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Glutes <span class="val" id="v-glutes">0.50</span></label>
        <input type="range" id="s-glutes" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>

    <div class="option-group">
      <h3>Face</h3>
      <div class="slider-row">
        <label>Head Size <span class="val" id="v-headsize">0.50</span></label>
        <input type="range" id="s-headsize" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Jaw <span class="val" id="v-jaw">0.50</span></label>
        <input type="range" id="s-jaw" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Cheeks <span class="val" id="v-cheeks">0.50</span></label>
        <input type="range" id="s-cheeks" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Nose <span class="val" id="v-nose">0.50</span></label>
        <input type="range" id="s-nose" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>

    <div class="option-group">
      <h3>Skin Tone <span class="count" id="c-skins"></span></h3>
      <div class="swatch-row" id="skins"></div>
    </div>

    <div class="option-group">
      <h3>Hair Style <span class="count" id="c-hairs"></span></h3>
      <div class="option-row" id="hairs"></div>
    </div>

    <div class="option-group">
      <h3>Hair Colour <span class="count" id="c-haircols"></span></h3>
      <div class="swatch-row" id="haircols"></div>
    </div>

    <div class="option-group">
      <h3>Eye Colour <span class="count" id="c-eyecols"></span></h3>
      <div class="swatch-row" id="eyecols"></div>
    </div>

    <div class="option-group">
      <h3>Shorts Colour <span class="count" id="c-briefcols"></span></h3>
      <div class="swatch-row" id="briefcols"></div>
    </div>

    <div class="option-group">
      <div class="action-row">
        <button class="action-btn" id="random-btn">🎲 Randomise</button>
        <button class="action-btn" id="reset-btn">↺ Reset</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/three.min.js?v=1"></script>
<script src="vendor/GLTFLoader.js?v=1"></script>
<script>
// ═══════════════════════════════════════════════
// DISTORTED — Character Customisation (Blender model)
// PC-only build: full free camera (orbit + pan + zoom-anywhere)
// ═══════════════════════════════════════════════

const SKINS = ['#fbe3cf','#f5dcc6','#eec9a8','#e6bd97','#e0b083','#d3a273',
               '#cd9a63','#b87f4a','#a06a3a','#9a6533','#7c4f27','#5e3a1c'];
const HAIRCOLS = ['#1a1208','#2b1c12','#4a2f18','#653e1d','#7a4a22','#96602c','#b07a3a',
                  '#c99a55','#d9b26a','#e8d9a0','#8a8a8a','#3a3a3a','#a83a2a','#2a4a8a'];
const EYECOLS = ['#2a1c10','#4a2f14','#6b4423','#2e6b4f','#3d7a4a','#3a6ea5','#5b8db8','#7a9bb8','#808080','#5a4632'];
const BRIEFCOLS = ['#12141c','#22252f','#2a2d3a','#4a4d5e','#6c5ce7','#a855f7',
                   '#4a9eff','#1ad8ff','#ef4444','#22c55e','#facc15','#ec4899'];

const HAIRS = [
  { id: 'none',       label: '🚫', name: 'None' },
  { id: 'short01',    label: '✂️', name: 'Short 1' },
  { id: 'short02',    label: '💈', name: 'Short 2' },
  { id: 'short03',    label: '🧑', name: 'Short 3' },
  { id: 'short04',    label: '👦', name: 'Short 4' },
  { id: 'afro01',     label: '🌀', name: 'Afro' },
  { id: 'long01',     label: '💇', name: 'Long' },
  { id: 'ponytail01', label: '🎀', name: 'Ponytail' },
  { id: 'bob01',      label: '💇‍♀️', name: 'Bob' },
  { id: 'bob02',      label: '🌸', name: 'Bob 2' },
  { id: 'braid01',    label: '🪢', name: 'Braid' },
];

// every slider -> morph target name on the model
const SLIDERS = [
  ['s-height','v-height','height','Height'],
  ['s-build','v-build','build','Build'],
  ['s-muscle','v-muscle','muscle','Muscle'],
  ['s-shoulders','v-shoulders','shoulders','Shoulders'],
  ['s-chest','v-chest','chest','Chest'],
  ['s-waist','v-waist','waist','Waist'],
  ['s-hips','v-hips','hips','Hips'],
  ['s-glutes','v-glutes','glutes','Glutes'],
  ['s-headsize','v-headsize','headsize','Head Size'],
  ['s-jaw','v-jaw','jaw','Jaw'],
  ['s-cheeks','v-cheeks','cheeks','Cheeks'],
  ['s-nose','v-nose','nose','Nose'],
];

const DEFAULT_STATE = {
  height:0.5, build:0.5, muscle:0.5, shoulders:0.5, chest:0.5, waist:0.5, hips:0.5,
  glutes:0.5, headsize:0.5, jaw:0.5, cheeks:0.5, nose:0.5,
  skin:2, hair:'short01', hairCol:0, eye:0, briefCol:0
};
const state = Object.assign({}, DEFAULT_STATE);
try {
  const saved = JSON.parse(localStorage.getItem('distorted_custom') || 'null');
  if (saved) Object.assign(state, saved);
} catch (e) {}

// ─── three.js scene ───
const canvas = document.getElementById('preview-canvas');
let renderer = null;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
  renderer.outputEncoding = THREE.sRGBEncoding;
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.05;
} catch (e) {
  console.error('WebGL unavailable', e);
  document.getElementById('loading').innerHTML =
    '<div style="color:#ff7597;text-align:center;padding:0 24px;line-height:1.6">3D not supported here.<br>Open this on a PC with a normal browser.</div>';
}

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, 1, 0.03, 200);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2a3a, 1.05));
const key = new THREE.DirectionalLight(0xfff2e6, 2.2); key.position.set(2.5, 4, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x8aa0ff, 1.4); rim.position.set(-3, 2.5, -3.5); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-2, 1.5, 3); scene.add(fill);

const root = new THREE.Group();
scene.add(root);

// ─── object registry ───
const OBJ = { body: null, briefs: null, eyes: [], hairs: {} };
let matSkin, matBriefs, matEye, matHair = {};

function setMorph(mesh, name, v) {
  if (!mesh || !mesh.morphTargetDictionary) return;
  const i = mesh.morphTargetDictionary[name];
  if (i === undefined) return;
  mesh.morphTargetInfluences[i] = v;
}

function allMorphMeshes() {
  const list = [];
  if (OBJ.body) list.push(OBJ.body);
  if (OBJ.briefs) list.push(OBJ.briefs);
  for (const k in OBJ.hairs) list.push(OBJ.hairs[k]);
  for (const e of OBJ.eyes) list.push(e);
  return list;
}

function applyMorphs() {
  const meshes = allMorphMeshes();
  for (const [, , key, target] of SLIDERS) {
    const v = state[key] * 2 - 1;
    for (const mesh of meshes) setMorph(mesh, target, v);
  }
}

function applySkin()    { if (matSkin) matSkin.color.set(SKINS[state.skin]); }
function applyHairCol() { const c = HAIRCOLS[state.hairCol]; for (const k in matHair) if (matHair[k]) matHair[k].color.set(c); }
function applyEye()     { if (matEye) matEye.color.set(EYECOLS[state.eye]); }
function applyBriefs()  { if (matBriefs) matBriefs.color.set(BRIEFCOLS[state.briefCol]); }
function applyHairVisibility() { for (const k in OBJ.hairs) OBJ.hairs[k].visible = (k === state.hair); }

function applyAll() {
  applyMorphs(); applySkin(); applyHairCol(); applyEye(); applyBriefs(); applyHairVisibility();
}

// ─── load model ───
const loader = new THREE.GLTFLoader();
loader.load('distorted-char.glb?v=6', (gltf) => {
  const model = gltf.scene;
  model.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    o.castShadow = false;
    const n = o.name;
    if (/^Body/.test(n)) { OBJ.body = o; matSkin = o.material; }
    else if (/^Briefs/.test(n)) { OBJ.briefs = o; matBriefs = o.material; }
    else if (/^Eye/.test(n)) { OBJ.eyes.push(o); matEye = o.material; }
    else if (/^Hair_(.+)/.test(n)) {
      const id = n.match(/^Hair_(.+)/)[1];
      OBJ.hairs[id] = o; matHair[id] = o.material;
      o.material.transparent = false;
    }
  });
  root.add(model);
  applyAll();
  refreshUI();
  document.getElementById('loading').classList.add('hidden');
}, undefined, (err) => {
  document.getElementById('loading').innerHTML = '<div style="color:#ff7597">FAILED TO LOAD MODEL</div>';
  console.error(err);
});

// ─── UI ───
function swatches(containerId, arr, key, apply, countId) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  arr.forEach((col, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (state[key] === i ? ' active' : '');
    el.style.background = col;
    el.addEventListener('click', () => {
      state[key] = i;
      c.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      apply();
    });
    c.appendChild(el);
  });
  if (countId) document.getElementById(countId).textContent = arr.length + ' options';
}

function buildHairs() {
  const c = document.getElementById('hairs');
  c.innerHTML = '';
  HAIRS.forEach(h => {
    const el = document.createElement('div');
    el.className = 'hair-card' + (state.hair === h.id ? ' active' : '');
    el.textContent = h.label;
    el.title = h.name;
    el.addEventListener('click', () => {
      state.hair = h.id;
      c.querySelectorAll('.hair-card').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      applyHairVisibility();
    });
    c.appendChild(el);
  });
  document.getElementById('c-hairs').textContent = HAIRS.length + ' styles';
}

function slider(id, vid, key, apply, fmt) {
  const s = document.getElementById(id), v = document.getElementById(vid);
  s.value = state[key];
  v.textContent = Number(state[key]).toFixed(2);
  s.addEventListener('input', () => {
    state[key] = Number(s.value);
    v.textContent = state[key].toFixed(2);
    apply();
  });
}

function buildUI() {
  swatches('skins', SKINS, 'skin', applySkin, 'c-skins');
  swatches('haircols', HAIRCOLS, 'hairCol', applyHairCol, 'c-haircols');
  swatches('eyecols', EYECOLS, 'eye', applyEye, 'c-eyecols');
  swatches('briefcols', BRIEFCOLS, 'briefCol', applyBriefs, 'c-briefcols');
  buildHairs();
  for (const [id, vid, key] of SLIDERS) slider(id, vid, key, applyMorphs);
  refreshUI();
}

function refreshUI() {
  const pairs = [['skins','skin'],['haircols','hairCol'],['eyecols','eye'],['briefcols','briefCol']];
  for (const [cid, key] of pairs) {
    document.querySelectorAll('#' + cid + ' .swatch').forEach((e, i) => e.classList.toggle('active', i === state[key]));
  }
  document.querySelectorAll('#hairs .hair-card').forEach((e, i) => e.classList.toggle('active', HAIRS[i].id === state.hair));
  for (const [id, vid, key] of SLIDERS) {
    const s = document.getElementById(id); if (s) s.value = state[key];
    const v = document.getElementById(vid); if (v) v.textContent = Number(state[key]).toFixed(2);
  }
}

// ─── randomise / reset ───
document.getElementById('random-btn').addEventListener('click', () => {
  state.skin = Math.floor(Math.random()*SKINS.length);
  state.hairCol = Math.floor(Math.random()*HAIRCOLS.length);
  state.eye = Math.floor(Math.random()*EYECOLS.length);
  state.briefCol = Math.floor(Math.random()*BRIEFCOLS.length);
  state.hair = HAIRS[Math.floor(Math.random()*HAIRS.length)].id;
  for (const [, , key] of SLIDERS) state[key] = Math.random();
  applyAll(); refreshUI();
});
document.getElementById('reset-btn').addEventListener('click', () => {
  Object.assign(state, DEFAULT_STATE);
  applyAll(); refreshUI();
});

// ═══════════════════════════════════════════════
// FREE CAMERA — orbit + pan + zoom-anywhere
// ═══════════════════════════════════════════════
const HOME = { theta: 0, phi: 1.42, radius: 3.5, target: new THREE.Vector3(0, 0.95, 0) };
let theta = HOME.theta, phi = HOME.phi, radius = HOME.radius;
const camTarget = HOME.target.clone();

const PHI_MIN = 0.06, PHI_MAX = Math.PI - 0.06;
const R_MIN = 0.18, R_MAX = 16;

function applyCamera() {
  if (!renderer) return;
  const sp = Math.sin(phi), cp = Math.cos(phi);
  camera.position.set(
    camTarget.x + radius * sp * Math.sin(theta),
    camTarget.y + radius * cp,
    camTarget.z + radius * sp * Math.cos(theta)
  );
  camera.lookAt(camTarget);
}

function resetView() {
  theta = HOME.theta; phi = HOME.phi; radius = HOME.radius;
  camTarget.copy(HOME.target);
  applyCamera();
}
function focusOn(y, dist) {
  camTarget.set(0, y, 0);
  radius = dist;
  theta = 0; phi = 1.42;
  applyCamera();
}

// drag state
let drag = null;
canvas.addEventListener('pointerdown', e => {
  try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
  drag = { x: e.clientX, y: e.clientY, btn: e.button, shift: e.shiftKey };
  canvas.classList.add('grabbing');
});
canvas.addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.btn === 2 || drag.btn === 1 || drag.shift) {
    panByPixels(dx, dy);
  } else {
    theta -= dx * 0.008;
    phi = Math.max(PHI_MIN, Math.min(PHI_MAX, phi - dy * 0.008));
    applyCamera();
  }
});
function endDrag() {
  drag = null;
  canvas.classList.remove('grabbing');
  try { canvas.releasePointerCapture(0); } catch (_) {}
}
canvas.addEventListener('pointerup', endDrag);
canvas.addEventListener('pointercancel', endDrag);
window.addEventListener('blur', endDrag);
canvas.addEventListener('contextmenu', e => e.preventDefault());

// pan: slide the focus point along the camera's screen plane
function panByPixels(dx, dy) {
  const fovR = camera.fov * Math.PI / 180;
  const worldPerPx = (2 * Math.tan(fovR / 2) * radius) / canvas.clientHeight;
  const fwd = new THREE.Vector3(); camera.getWorldDirection(fwd);
  const right = new THREE.Vector3().crossVectors(fwd, camera.up).normalize();
  const up = new THREE.Vector3().crossVectors(right, fwd).normalize();
  camTarget.addScaledVector(right, -dx * worldPerPx);
  camTarget.addScaledVector(up, dy * worldPerPx);
  applyCamera();
}

// zoom — zooms toward whatever is under the cursor (zoom "anywhere")
const raycaster = new THREE.Raycaster();
function zoomAt(clientX, clientY, factor) {
  const r = canvas.getBoundingClientRect();
  const ndc = new THREE.Vector2(
    ((clientX - r.left) / r.width) * 2 - 1,
    -((clientY - r.top) / r.height) * 2 + 1
  );
  const newR = Math.max(R_MIN, Math.min(R_MAX, radius * factor));
  raycaster.setFromCamera(ndc, camera);
  const hits = raycaster.intersectObject(root, true);
  if (hits.length) {
    const t = THREE.MathUtils.clamp(1 - newR / radius, 0, 1);
    if (t > 0) camTarget.lerp(hits[0].point, t * 0.6);   // zoom in toward the cursor
  }
  radius = newR;
  applyCamera();
}
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  const mag = Math.min(Math.abs(e.deltaY), 120);
  const factor = Math.exp((e.deltaY > 0 ? 1 : -1) * mag * 0.0022);
  zoomAt(e.clientX, e.clientY, factor);
}, { passive: false });

// view buttons
document.getElementById('view-reset').addEventListener('click', resetView);
document.getElementById('view-head').addEventListener('click', () => focusOn(1.62, 0.95));
document.getElementById('view-feet').addEventListener('click', () => focusOn(0.16, 1.1));
document.getElementById('view-full').addEventListener('click', () => focusOn(0.95, 3.5));

// keyboard: R = reset view, arrows = orbit
document.addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') resetView();
  if (e.key === 'ArrowLeft')  { theta += 0.08; applyCamera(); }
  if (e.key === 'ArrowRight') { theta -= 0.08; applyCamera(); }
  if (e.key === 'ArrowUp')    { phi = Math.max(PHI_MIN, phi - 0.06); applyCamera(); }
  if (e.key === 'ArrowDown')  { phi = Math.min(PHI_MAX, phi + 0.06); applyCamera(); }
  if (e.key === 'Enter') document.getElementById('confirm-btn').click();
  if (e.key === 'Escape') document.getElementById('back-btn').click();
});

// ─── resize ───
function resize() {
  if (!renderer) return;
  const a = document.getElementById('preview-area').getBoundingClientRect();
  renderer.setSize(a.width, a.height, false);
  camera.aspect = a.width / a.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
applyCamera();

// ─── render loop ───
let spin = 0;
function loop() {
  if (!drag) { spin += 0.0009; }        // gentle idle turn only when idle
  root.rotation.y = spin;
  if (renderer) renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ─── save & return ───
document.getElementById('confirm-btn').addEventListener('click', () => {
  localStorage.setItem('distorted_custom', JSON.stringify(state));
  const btn = document.getElementById('confirm-btn');
  btn.textContent = '✓ SAVED';
  btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
  setTimeout(() => { btn.textContent = 'CONFIRM'; btn.style.background = 'linear-gradient(135deg, #6c5ce7, #a855f7)'; }, 1400);
});
document.getElementById('back-btn').addEventListener('click', () => { window.location.href = 'distorted-menu.html'; });

// ─── initial UI (buttons work even before the model finishes loading) ───
buildUI();
</script>
</body>
