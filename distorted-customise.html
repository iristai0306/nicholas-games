<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Distorted — Customise</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@400;600;700&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a12;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      user-select: none;
    }

    #scanlines {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      z-index: 999;
      pointer-events: none;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    }
    #scanlines::after {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%);
    }

    #top-bar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 24px;
      background: rgba(255,255,255,0.03);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      z-index: 100; flex-shrink: 0;
    }
    #top-bar h1 { font-family: 'Orbitron', monospace; font-size: 18px; letter-spacing: 6px; color: #a0a0cc; }
    #top-bar h1 span { color: #fff; }

    .nav-btn {
      font-family: 'Rajdhani', sans-serif;
      font-size: 14px; font-weight: 600; letter-spacing: 2px;
      color: #8899bb; background: none;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px; padding: 6px 18px; cursor: pointer; transition: all 0.2s;
    }
    .nav-btn:hover { color: #fff; border-color: rgba(255,255,255,0.3); background: rgba(255,255,255,0.05); }

    #confirm-btn {
      font-family: 'Rajdhani', sans-serif;
      font-size: 15px; font-weight: 700; letter-spacing: 3px;
      color: #fff; background: linear-gradient(135deg, #6c5ce7, #a855f7);
      border: none; border-radius: 8px; padding: 8px 30px; cursor: pointer;
      transition: all 0.2s; box-shadow: 0 0 20px rgba(108,92,231,0.3);
    }
    #confirm-btn:hover { transform: scale(1.04); box-shadow: 0 0 30px rgba(108,92,231,0.5); }

    #main { display: flex; flex: 1; min-height: 0; z-index: 50; }

    #preview-area { flex: 1; position: relative; background: radial-gradient(ellipse at 50% 42%, #1a1a2e 0%, #0a0a12 70%); }
    #preview-canvas { width: 100%; height: 100%; display: block; }

    #preview-name {
      position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
      font-family: 'Orbitron', monospace; font-size: 12px; letter-spacing: 5px;
      color: rgba(255,255,255,0.35); pointer-events: none;
    }
    #hint {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      font-size: 12px; letter-spacing: 2px; color: #667799; pointer-events: none;
    }
    #loading {
      position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      flex-direction: column; gap: 14px; background: #0a0a12; z-index: 200; transition: opacity .5s;
      font-family: 'Orbitron', monospace; letter-spacing: 4px; color: #6c7bd0; font-size: 13px;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    .spinner { width: 42px; height: 42px; border: 3px solid rgba(108,92,231,0.2); border-top-color: #a855f7; border-radius: 50%; animation: spin 0.9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    #options-panel {
      width: 330px; background: rgba(255,255,255,0.02);
      border-left: 1px solid rgba(255,255,255,0.06);
      padding: 20px; overflow-y: auto; flex-shrink: 0;
    }
    .option-group { margin-bottom: 22px; }
    .option-group h3 {
      font-size: 11px; font-weight: 600; letter-spacing: 3px; text-transform: uppercase;
      color: #667799; margin-bottom: 10px; padding-bottom: 4px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }

    .slider-row { margin-bottom: 14px; }
    .slider-row label { display: flex; justify-content: space-between; font-size: 13px; letter-spacing: 1px; color: #9aa8c8; margin-bottom: 5px; }
    .slider-row label .val { color: #a855f7; font-weight: 700; }
    input[type=range] {
      -webkit-appearance: none; width: 100%; height: 4px; border-radius: 2px;
      background: rgba(255,255,255,0.1); outline: none;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%;
      background: linear-gradient(135deg, #6c5ce7, #a855f7); cursor: pointer;
      box-shadow: 0 0 10px rgba(168,85,247,0.6);
    }
    input[type=range]::-moz-range-thumb {
      width: 16px; height: 16px; border: none; border-radius: 50%;
      background: #a855f7; cursor: pointer; box-shadow: 0 0 10px rgba(168,85,247,0.6);
    }

    .swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch {
      width: 34px; height: 34px; border-radius: 8px; border: 2px solid transparent;
      cursor: pointer; transition: all 0.15s;
    }
    .swatch:hover { transform: scale(1.12); }
    .swatch.active { border-color: #fff; box-shadow: 0 0 12px rgba(255,255,255,0.4); transform: scale(1.12); }

    .hair-card {
      width: 52px; height: 52px; border-radius: 10px; border: 2px solid rgba(255,255,255,0.08);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      font-size: 22px; transition: all 0.15s; background: rgba(255,255,255,0.03);
    }
    .hair-card:hover { border-color: rgba(255,255,255,0.25); background: rgba(255,255,255,0.06); }
    .hair-card.active { border-color: #6c5ce7; box-shadow: 0 0 16px rgba(108,92,231,0.4); background: rgba(108,92,231,0.12); }

    .option-row { display: flex; flex-wrap: wrap; gap: 8px; }

    .action-row { display: flex; gap: 10px; margin-top: 6px; }
    .action-btn {
      flex: 1; font-family: 'Rajdhani', sans-serif; font-weight: 700; font-size: 12.5px;
      letter-spacing: 1.6px; text-transform: uppercase; padding: 10px; cursor: pointer;
      color: #cfe9f5; background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.12); border-radius: 8px; transition: .18s;
    }
    .action-btn:hover { border-color: #6c5ce7; color: #fff; background: rgba(108,92,231,0.15); }

    #options-panel::-webkit-scrollbar { width: 4px; }
    #options-panel::-webkit-scrollbar-track { background: transparent; }
    #options-panel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 3px; }

    @media (max-width: 760px) {
      #main { flex-direction: column-reverse; }
      #options-panel { width: 100%; max-height: 46vh; border-left: none; border-top: 1px solid rgba(255,255,255,0.06); }
      #top-bar h1 { font-size: 13px; letter-spacing: 3px; }
      #confirm-btn { padding: 6px 16px; font-size: 13px; }
      .nav-btn { padding: 6px 12px; font-size: 12px; }
    }
  </style>
</head>
<body>

<div id="scanlines"></div>

<div id="top-bar">
  <button id="back-btn" class="nav-btn">← BACK</button>
  <h1><span>//</span> DISTORTED <span>//</span></h1>
  <button id="confirm-btn">CONFIRM</button>
</div>

<div id="main">
  <div id="preview-area">
    <canvas id="preview-canvas"></canvas>
    <div id="hint">DRAG TO ROTATE · SCROLL TO ZOOM</div>
    <div id="preview-name">YOUR CHARACTER</div>
    <div id="loading"><div class="spinner"></div>BUILDING YOUR BODY…</div>
  </div>

  <div id="options-panel">
    <div class="option-group">
      <h3>Body</h3>
      <div class="slider-row">
        <label>Height <span class="val" id="v-height">0.50</span></label>
        <input type="range" id="s-height" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Build <span class="val" id="v-build">0.50</span></label>
        <input type="range" id="s-build" min="0" max="1" step="0.01" value="0.5">
      </div>
      <div class="slider-row">
        <label>Muscle <span class="val" id="v-muscle">0.50</span></label>
        <input type="range" id="s-muscle" min="0" max="1" step="0.01" value="0.5">
      </div>
    </div>

    <div class="option-group">
      <h3>Skin Tone</h3>
      <div class="swatch-row" id="skins"></div>
    </div>

    <div class="option-group">
      <h3>Hair Style</h3>
      <div class="option-row" id="hairs"></div>
    </div>

    <div class="option-group">
      <h3>Hair Colour</h3>
      <div class="swatch-row" id="haircols"></div>
    </div>

    <div class="option-group">
      <h3>Eye Colour</h3>
      <div class="swatch-row" id="eyecols"></div>
    </div>

    <div class="option-group">
      <h3>Briefs Colour</h3>
      <div class="swatch-row" id="briefcols"></div>
    </div>

    <div class="option-group">
      <div class="action-row">
        <button class="action-btn" id="random-btn">🎲 Randomise</button>
        <button class="action-btn" id="reset-btn">↺ Reset</button>
      </div>
    </div>
  </div>
</div>

<script src="vendor/three.min.js?v=1"></script>
<script src="vendor/GLTFLoader.js?v=1"></script>
<script>
// ═══════════════════════════════════════════════
// DISTORTED — Character Customisation (Blender model)
// ═══════════════════════════════════════════════

const SKINS = ['#f5dcc6','#eec9a8','#e0b083','#cd9a63','#b87f4a','#9a6533','#7c4f27','#5e3a1c','#442a12'];
const HAIRCOLS = ['#2b1c12','#4a2f18','#7a4a22','#b07a3a','#d9b26a','#e8d9a0','#8a8a8a','#3a3a3a','#a83a2a','#2a4a8a'];
const EYECOLS = ['#4a2f14','#6b4423','#2e6b4f','#3a6ea5','#5b8db8','#808080','#3d7a4a'];
const BRIEFCOLS = ['#12141c','#2a2d3a','#6c5ce7','#a855f7','#4a9eff','#ef4444','#22c55e','#facc15','#ec4899'];

const HAIRS = [
  { id: 'none',       label: '🚫', name: 'None' },
  { id: 'short01',    label: '✂️', name: 'Short 1' },
  { id: 'short02',    label: '💈', name: 'Short 2' },
  { id: 'short03',    label: '🧑', name: 'Short 3' },
  { id: 'short04',    label: '👦', name: 'Short 4' },
  { id: 'afro01',     label: '🌀', name: 'Afro' },
  { id: 'long01',     label: '💇', name: 'Long' },
  { id: 'ponytail01', label: '🎀', name: 'Ponytail' },
  { id: 'bob01',      label: '💇‍♀️', name: 'Bob' },
];

const state = {
  height: 0.5, build: 0.5, muscle: 0.5,
  skin: 2, hair: 'short01', hairCol: 0, eye: 0, briefCol: 0
};

// ─── three.js scene ───
const canvas = document.getElementById('preview-canvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, 1, 0.1, 100);
let camDist = 3.4;
const camTarget = new THREE.Vector3(0, 0.92, 0);
camera.position.set(0, 1.0, camDist);

scene.add(new THREE.HemisphereLight(0xbfd4ff, 0x2a2a3a, 1.05));
const key = new THREE.DirectionalLight(0xfff2e6, 2.2); key.position.set(2.5, 4, 4); scene.add(key);
const rim = new THREE.DirectionalLight(0x8aa0ff, 1.4); rim.position.set(-3, 2.5, -3.5); scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, 0.5); fill.position.set(-2, 1.5, 3); scene.add(fill);

const root = new THREE.Group();
scene.add(root);

// ─── object registry ───
const OBJ = { body: null, briefs: null, eyes: [], hairs: {} };
let matSkin, matBriefs, matEye, matHair = {};

function setMorph(mesh, name, v) {
  if (!mesh || !mesh.morphTargetDictionary) return;
  const i = mesh.morphTargetDictionary[name];
  if (i === undefined) return;
  mesh.morphTargetInfluences[i] = v;
}

function allMorphMeshes() {
  const list = [];
  if (OBJ.body) list.push(OBJ.body);
  if (OBJ.briefs) list.push(OBJ.briefs);
  for (const k in OBJ.hairs) list.push(OBJ.hairs[k]);
  for (const e of OBJ.eyes) list.push(e);
  return list;
}

function applyMorphs() {
  const h = state.height * 2 - 1;
  const b = state.build * 2 - 1;
  const m = state.muscle * 2 - 1;
  for (const mesh of allMorphMeshes()) {
    setMorph(mesh, 'Height', h);
    setMorph(mesh, 'Build', b);
    setMorph(mesh, 'Muscle', m);
  }
}

function applySkin() {
  if (matSkin) matSkin.color.set(SKINS[state.skin]);
}
function applyHairCol() {
  const c = HAIRCOLS[state.hairCol];
  for (const k in matHair) if (matHair[k]) matHair[k].color.set(c);
}
function applyEye() {
  if (matEye) matEye.color.set(EYECOLS[state.eye]);
}
function applyBriefs() {
  if (matBriefs) matBriefs.color.set(BRIEFCOLS[state.briefCol]);
}
function applyHairVisibility() {
  for (const k in OBJ.hairs) OBJ.hairs[k].visible = (k === state.hair);
}

// ─── load model ───
const loader = new THREE.GLTFLoader();
loader.load('distorted-char.glb?v=4', (gltf) => {
  const model = gltf.scene;
  model.traverse(o => {
    if (!o.isMesh) return;
    o.frustumCulled = false;
    o.castShadow = false;
    const n = o.name;
    if (/^Body/.test(n)) { OBJ.body = o; matSkin = o.material; }
    else if (/^Briefs/.test(n)) { OBJ.briefs = o; matBriefs = o.material; }
    else if (/^Eye/.test(n)) { OBJ.eyes.push(o); matEye = o.material; }
    else if (/^Hair_(.+)/.test(n)) {
      const id = n.match(/^Hair_(.+)/)[1];
      OBJ.hairs[id] = o; matHair[id] = o.material;
      o.material.transparent = false;
    }
  });
  root.add(model);
  applyMorphs(); applySkin(); applyHairCol(); applyEye(); applyBriefs(); applyHairVisibility();
  document.getElementById('loading').classList.add('hidden');
}, undefined, (err) => {
  document.getElementById('loading').innerHTML = '<div style="color:#ff7597">FAILED TO LOAD MODEL</div>';
  console.error(err);
});

// ─── UI builders ───
function swatches(containerId, arr, key, apply) {
  const c = document.getElementById(containerId);
  c.innerHTML = '';
  arr.forEach((col, i) => {
    const el = document.createElement('div');
    el.className = 'swatch' + (state[key] === i ? ' active' : '');
    el.style.background = col;
    el.addEventListener('click', () => {
      state[key] = i;
      c.querySelectorAll('.swatch').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      apply();
    });
    c.appendChild(el);
  });
}
swatches('skins', SKINS, 'skin', applySkin);
swatches('haircols', HAIRCOLS, 'hairCol', applyHairCol);
swatches('eyecols', EYECOLS, 'eye', applyEye);
swatches('briefcols', BRIEFCOLS, 'briefCol', applyBriefs);

function buildHairs() {
  const c = document.getElementById('hairs');
  c.innerHTML = '';
  HAIRS.forEach(h => {
    const el = document.createElement('div');
    el.className = 'hair-card' + (state.hair === h.id ? ' active' : '');
    el.textContent = h.label;
    el.title = h.name;
    el.addEventListener('click', () => {
      state.hair = h.id;
      c.querySelectorAll('.hair-card').forEach(s => s.classList.remove('active'));
      el.classList.add('active');
      applyHairVisibility();
    });
    c.appendChild(el);
  });
}
buildHairs();

function slider(id, vid, key, apply, fmt) {
  const s = document.getElementById(id), v = document.getElementById(vid);
  s.value = state[key];
  v.textContent = Number(state[key]).toFixed(2);
  s.addEventListener('input', () => {
    state[key] = Number(s.value);
    v.textContent = state[key].toFixed(2);
    apply();
  });
}
slider('s-height','v-height','height', applyMorphs);
slider('s-build','v-build','build', applyMorphs);
slider('s-muscle','v-muscle','muscle', applyMorphs);

// ─── randomise / reset ───
function refreshUI() {
  document.querySelectorAll('#skins .swatch').forEach((e,i)=>e.classList.toggle('active', i===state.skin));
  document.querySelectorAll('#haircols .swatch').forEach((e,i)=>e.classList.toggle('active', i===state.hairCol));
  document.querySelectorAll('#eyecols .swatch').forEach((e,i)=>e.classList.toggle('active', i===state.eye));
  document.querySelectorAll('#briefcols .swatch').forEach((e,i)=>e.classList.toggle('active', i===state.briefCol));
  document.querySelectorAll('#hairs .hair-card').forEach((e,i)=>e.classList.toggle('active', HAIRS[i].id===state.hair));
  for (const [id,vid,key] of [['s-height','v-height','height'],['s-build','v-build','build'],['s-muscle','v-muscle','muscle']]) {
    document.getElementById(id).value = state[key];
    document.getElementById(vid).textContent = Number(state[key]).toFixed(2);
  }
}
document.getElementById('random-btn').addEventListener('click', () => {
  state.skin = Math.floor(Math.random()*SKINS.length);
  state.hairCol = Math.floor(Math.random()*HAIRCOLS.length);
  state.eye = Math.floor(Math.random()*EYECOLS.length);
  state.briefCol = Math.floor(Math.random()*BRIEFCOLS.length);
  state.hair = HAIRS[Math.floor(Math.random()*HAIRS.length)].id;
  state.height = Math.random(); state.build = Math.random(); state.muscle = Math.random();
  applyMorphs(); applySkin(); applyHairCol(); applyEye(); applyBriefs(); applyHairVisibility(); refreshUI();
});
document.getElementById('reset-btn').addEventListener('click', () => {
  Object.assign(state, { height:0.5, build:0.5, muscle:0.5, skin:2, hair:'short01', hairCol:0, eye:0, briefCol:0 });
  applyMorphs(); applySkin(); applyHairCol(); applyEye(); applyBriefs(); applyHairVisibility(); refreshUI();
});

// ─── resize ───
function resize() {
  const a = document.getElementById('preview-area').getBoundingClientRect();
  renderer.setSize(a.width, a.height, false);
  camera.aspect = a.width / a.height;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

// ─── orbit (drag rotate + wheel zoom) ───
let dragging = false, lastX = 0, rotY = 0, rotX = 0;
function down(x){ dragging = true; lastX = x; }
function move(x){ if(!dragging) return; rotY += (x-lastX)*0.01; lastX = x; root.rotation.y = rotY; }
function up(){ dragging = false; }
canvas.addEventListener('mousedown', e => down(e.clientX));
window.addEventListener('mousemove', e => move(e.clientX));
window.addEventListener('mouseup', up);
canvas.addEventListener('touchstart', e => down(e.touches[0].clientX), {passive:true});
canvas.addEventListener('touchmove', e => move(e.touches[0].clientX), {passive:true});
canvas.addEventListener('touchend', up);
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  camDist = Math.min(6, Math.max(1.8, camDist + e.deltaY*0.002));
  camera.position.z = camDist;
}, {passive:false});

// ─── render loop ───
let t0 = performance.now();
function loop(now) {
  const dt = (now - t0) / 1000; t0 = now;
  // gentle idle sway
  if (!dragging) root.rotation.y += Math.sin(now*0.00035)*0.0006;
  camera.lookAt(camTarget);
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ─── save & return ───
document.getElementById('confirm-btn').addEventListener('click', () => {
  localStorage.setItem('distorted_custom', JSON.stringify(state));
  const btn = document.getElementById('confirm-btn');
  btn.textContent = '✓ SAVED';
  btn.style.background = 'linear-gradient(135deg, #22c55e, #16a34a)';
  setTimeout(() => { btn.textContent = 'CONFIRM'; btn.style.background = 'linear-gradient(135deg, #6c5ce7, #a855f7)'; }, 1400);
});
document.getElementById('back-btn').addEventListener('click', () => { window.location.href = 'distorted-menu.html'; });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') document.getElementById('confirm-btn').click();
  if (e.key === 'Escape') document.getElementById('back-btn').click();
});
</script>
</body>
</html>
