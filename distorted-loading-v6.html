<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Distorted — Loading Screen v6</title>
<link rel="icon" href="favicon.ico" sizes="any">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04060d;overflow:hidden;font-family:'Segoe UI',system-ui,sans-serif;color:#dff4ff}
  canvas{display:block;width:100vw;height:100vh}
  .ov{position:fixed;inset:0;pointer-events:none}
  #scan{background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(255,255,255,.024) 2px,rgba(255,255,255,.024) 4px);mix-blend-mode:overlay;z-index:6;opacity:.7}
  #vig{background:radial-gradient(ellipse at 50% 52%,transparent 42%,rgba(0,0,0,.82) 105%);z-index:7}
  #flash{background:#ff8fbf;opacity:0;z-index:8}
  .mono{font-family:ui-monospace,Menlo,Consolas,monospace}

  #brand{position:fixed;left:30px;top:26px;z-index:5}
  #brand .t{font-weight:900;letter-spacing:.34em;font-size:clamp(15px,2.4vw,22px);color:#eafcff;text-shadow:0 0 22px rgba(0,200,255,.55)}
  #brand .s{margin-top:6px;font-size:9.5px;letter-spacing:.42em;color:#3f6a80;text-transform:uppercase}

  #beat{position:fixed;left:0;right:0;bottom:172px;z-index:5;text-align:center;pointer-events:none}
  #beat div{font-size:clamp(11px,1.5vw,13px);letter-spacing:2.8px;text-transform:uppercase;
    color:#7fd6f0;text-shadow:0 0 14px rgba(0,180,255,.5);transition:opacity .3s}
  #beat .warn{color:#ff8fb8;text-shadow:0 0 18px rgba(255,95,150,.75)}

  #load{position:fixed;left:50%;transform:translateX(-50%);bottom:78px;z-index:5;width:min(62vw,560px)}
  #bar{height:3px;background:#0c1a24;position:relative;overflow:hidden;border-radius:2px}
  #bar .fl{position:absolute;inset:0;width:0%;background:linear-gradient(90deg,#005f7d,#00c8ff,#8ff8ff);box-shadow:0 0 14px rgba(0,200,255,.85)}
  #bar .fl::after{content:'';position:absolute;right:0;top:-3px;width:3px;height:9px;background:#fff;box-shadow:0 0 12px #fff}
  #bar .ticks{position:absolute;inset:0}
  #bar .ticks i{position:absolute;top:0;height:100%;width:1px;background:rgba(0,0,0,.55)}
  #info{display:flex;justify-content:space-between;align-items:flex-end;margin-top:8px}
  #task{font-size:10px;letter-spacing:.26em;color:#5c8ba3;text-transform:uppercase}
  #task b{color:#8ff8ff;font-weight:600}
  #pct{font-size:20px;font-weight:800;letter-spacing:.06em;color:#eafcff;text-shadow:0 0 18px rgba(0,200,255,.7)}
  #sub{font-size:9.5px;letter-spacing:.22em;color:#3f6a80;text-transform:uppercase;margin-top:2px;text-align:right}

  #footer{position:fixed;left:30px;bottom:34px;z-index:5;font-size:9.5px;letter-spacing:.24em;color:#3f6a80;text-transform:uppercase}
  #footer b{color:#8ff8ff;font-weight:600}

  #enter{position:fixed;inset:0;z-index:9;display:none;align-items:center;justify-content:center;flex-direction:column;
    background:rgba(3,5,10,.32);cursor:pointer}
  #enter .cta{font-weight:700;font-size:clamp(15px,3.2vw,22px);letter-spacing:.32em;color:#fff;
    text-shadow:0 0 30px rgba(0,200,255,.6);animation:flick 2.4s infinite}
  @keyframes flick{0%,100%{opacity:.5}48%{opacity:1}52%{opacity:.35}56%{opacity:1}}
  #enter .l{font-size:10px;letter-spacing:.4em;color:#5c8ba3;margin-top:14px;text-transform:uppercase}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="ov" id="scan"></div>
<div class="ov" id="vig"></div>
<div class="ov" id="flash"></div>

<div id="brand"><div class="t mono">DISTORTED</div><div class="s">A 3D OPEN-WORLD ADVENTURE</div></div>

<div id="beat"></div>

<div id="load">
  <div id="bar"><div class="fl"></div><div class="ticks" id="ticks"></div></div>
  <div id="info">
    <div><div id="task">Initialising</div><div id="sub">booting</div></div>
    <div id="pct">0%</div>
  </div>
</div>

<div id="footer">[SHIFT-CLASS: <b>DRIFTER</b>] &nbsp;•&nbsp; [ANCHOR <b id="anchorState">SYNCING</b>]</div>

<div id="enter"><div class="cta mono">▶ PRESS TO ENTER</div><div class="l">Reality seam stabilised</div></div>

<script>
/* =====================================================================
   DISTORTED — loading v6
   Real byte-driven loading, but PACED: MIN_MS guarantees the screen always
   lasts at least this long on a fast connection (and takes longer if the
   real download is slow). Pacing stretches both the bar AND the boot log.
   ===================================================================== */

/* ---- tune this: minimum total load time in milliseconds ---- */
const MIN_MS = 9000;

const cv=document.getElementById('c'), ctx=cv.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);
  W=cv.width=innerWidth*DPR; H=cv.height=innerHeight*DPR;
  cv.style.width=innerWidth+'px'; cv.style.height=innerHeight+'px';}
resize(); addEventListener('resize',resize);

let t0=performance.now();
let P=0;                       // smoothed progress for visuals (0..100)
let realP=0;                   // ACTUAL load progress (0..100)
let descend=0, camX=0, camY=330, camZ=0;
let glitchAmt=0, seam=0, seamSpike=0, done=false, entered=false;
const HORIZON_F=0.52;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ---------------- assets to REALLY load ---------------- */
const FALLBACK={
  'vendor/three.min.js':603445, 'vendor/GLTFLoader.js':96550,
  'earth/tex2/day.jpg':830627, 'earth/tex2/night.jpg':484833,
  'earth/tex2/clouds.jpg':658811, 'earth/tex2/spec.jpg':221151,
  'distorted-char.glb':6993676
};
const ASSETS=[
  {label:'three.js engine',   url:'vendor/three.min.js',   grp:'engine',  phase:'Booting runtime'},
  {label:'GLTF loader',       url:'vendor/GLTFLoader.js',  grp:'engine',  phase:'Booting runtime'},
  {label:'surface — day',     url:'earth/tex2/day.jpg',    grp:'texture', phase:'Streaming surfaces'},
  {label:'surface — night',   url:'earth/tex2/night.jpg',  grp:'texture', phase:'Streaming surfaces'},
  {label:'surface — clouds',  url:'earth/tex2/clouds.jpg', grp:'texture', phase:'Streaming surfaces'},
  {label:'surface — specular',url:'earth/tex2/spec.jpg',   grp:'texture', phase:'Streaming surfaces'},
  {label:'character rig',     url:'distorted-char.glb',    grp:'char',    phase:'Assembling character'},
];
let totalBytes=0;

const beatEl=document.getElementById('beat'), pctEl=document.getElementById('pct'),
      taskEl=document.getElementById('task'), subEl=document.getElementById('sub'),
      barFl=document.querySelector('#bar .fl'), ticksEl=document.getElementById('ticks'),
      flashEl=document.getElementById('flash'), anchorEl=document.getElementById('anchorState');

for(let i=1;i<20;i++){const s=document.createElement('i');s.style.left=(i*5)+'%';ticksEl.appendChild(s);}

function glitch(a=.9){glitchAmt=a;setTimeout(()=>glitchAmt=Math.min(glitchAmt,.3),80);setTimeout(()=>glitchAmt=0,160);}
function flash(a,c='#ff8fbf'){flashEl.style.background=c;flashEl.style.transition='none';flashEl.style.opacity=a;
  requestAnimationFrame(()=>{flashEl.style.transition='opacity .5s';flashEl.style.opacity=0;});}
const mb=b=>(b/1048576).toFixed(1)+' MB';

async function fetchAsset(a, groupObj){
  const r=await fetch(a.url,{cache:'no-store'});
  if(!r.body || !r.body.getReader){
    const buf=await r.arrayBuffer();
    groupObj.loaded+=(buf.byteLength||a.sz);
    return;
  }
  const reader=r.body.getReader();
  while(true){
    const {done:rd,value}=await reader.read();
    if(rd) break;
    groupObj.loaded+=value.length;
  }
}

/* wait until wall-clock has reached the paced point for `frac` of the load */
async function pace(frac){
  const target=frac*MIN_MS;
  const el=performance.now()-t0;
  if(el<target) await sleep(target-el);
}

async function runLoader(){
  // 1) size up every asset
  await Promise.all(ASSETS.map(async a=>{
    try{ const r=await fetch(a.url,{method:'HEAD'}); const cl=+(r.headers.get('content-length')||0);
         a.sz=cl||FALLBACK[a.url]||0; }catch(e){ a.sz=FALLBACK[a.url]||0; }
  }));
  totalBytes=ASSETS.reduce((s,a)=>s+a.sz,0)||1;

  // 2) download sequentially, paced to MIN_MS
  let doneBytes=0;
  for(let i=0;i<ASSETS.length;i++){
    const a=ASSETS[i];
    taskEl.innerHTML=a.phase;
    subEl.textContent=(a.grp==='char'?'CHRONO-SCOUT MK IV':a.label);
    logLine(`> ${a.label} …`);
    const groupObj={base:doneBytes, loaded:0};
    const start=performance.now();
    try{ await fetchAsset(a,groupObj); }
    catch(e){ groupObj.loaded=a.sz; }
    doneBytes += (groupObj.loaded || a.sz);
    realP=Math.min(99.4, doneBytes/totalBytes*100);
    const took=((performance.now()-start)/1000).toFixed(1);
    logLine(`> ${a.label} ${'·'.repeat(Math.max(2,22-a.label.length))} ${mb(a.sz)} OK (${took}s)`, 'ok');
    if(a.grp!=='engine') glitch(.35);
    /* pacing: spread the phases so the screen lasts MIN_MS even on fast pipes */
    await pace((i+1)/ASSETS.length * 0.96);
  }
  realP=100;
  await pace(1);
}
runLoader().catch(e=>{ realP=100; });

/* boot log (drawn on canvas) */
const logLines=[];
function logLine(s,c){ logLines.push({s,c}); if(logLines.length>9)logLines.shift(); }
function drawLog(){
  ctx.save();
  ctx.font=`${11*DPR}px ui-monospace,monospace`;
  ctx.textAlign='left'; ctx.textBaseline='top';
  const x=30*DPR, y0=H*0.5;
  for(let i=0;i<logLines.length;i++){
    const L=logLines[i];
    ctx.fillStyle = L.c==='ok' ? 'rgba(125,255,176,.75)' : 'rgba(77,127,150,.65)';
    ctx.fillText(L.s, x, y0+i*17*DPR);
  }
  ctx.restore();
}

/* ---------- stars ---------- */
const stars=Array.from({length:190},()=>({x:Math.random(),y:Math.random(),z:Math.random()*.8+.2,tw:Math.random()*6.28}));
/* ---------- clouds ---------- */
const clouds=Array.from({length:50},()=>({
  x:(Math.random()-.5)*2.4, y:(Math.random()-.5)*2.6, z:Math.random(),
  r:130+Math.random()*280, a:.05+Math.random()*.12, v:0.4+Math.random()*1.0
}));

const FOCAL=780;
function proj(wx,wy,wz){
  const dz=wz-camZ; if(dz<=1) return null;
  const s=FOCAL/dz;
  return {x:W/2+(wx-camX)*s*DPR, y:H*HORIZON_F+(camY-wy)*s*DPR, s:s*DPR, dz};
}

/* ---------- city ---------- */
const buildings=[];
(function seed(){
  const N=34, span=2800, cell=span/N;
  for(let i=0;i<N;i++){
    for(let j=0;j<N;j++){
      const bx=(i-N/2)*cell + (Math.random()-.5)*cell*.42;
      const bz=(j+1)*cell + (Math.random()-.5)*cell*.42;
      const dc=Math.hypot(bx,bz);
      if(dc<220) continue;
      const far=Math.min(1, dc/1700);
      let h=(70+Math.random()*170)*(0.5+far);
      if(Math.random()<0.045) h*=2.2;
      buildings.push({x:bx,z:bz,w:cell*(0.4+Math.random()*0.32),h,
        buildAt:Math.random()*0.76, glow:Math.random()<0.10,
        col:Math.random()<0.5?'26,50,78':'20,38,62', win:Math.random(), seed:Math.random()*99});
    }
  }
  buildings.sort((a,b)=>b.z-a.z);
})();

/* ---------- roads ---------- */
const roads=[];
(function(){
  const N=34, span=2800, step=span/N;
  for(let i=0;i<=N;i++){
    roads.push({axis:'z', p:(i-N/2)*step, at:Math.random()*0.45});
    roads.push({axis:'x', p:i*step,       at:Math.random()*0.45});
  }
})();

/* ---------- reality seam — fixed world object ---------- */
const SEAM={ x:-560, z:1900, h:2800, seg:26 };
const seamJag=[];
(function(){ let s=90210; const rnd=()=>{ s=(s*1103515245+12345)&0x7fffffff; return s/0x7fffffff; };
  for(let i=0;i<=SEAM.seg;i++) seamJag.push(rnd()*2-1); })();
const seamBranch=[ {f:0.35,len:0.30,dir:1}, {f:0.62,len:0.22,dir:-1}, {f:0.80,len:0.16,dir:1} ];

function seamPoints(t){
  const base=proj(SEAM.x,0,SEAM.z), top=proj(SEAM.x,SEAM.h,SEAM.z);
  if(!base||!top) return null;
  const amp=Math.max(3,30*base.s*0.5)*(0.5+0.9*seam);
  const pts=[];
  for(let i=0;i<=SEAM.seg;i++){
    const f=i/SEAM.seg;
    const x=top.x+(base.x-top.x)*f + seamJag[i]*amp + Math.sin(i*0.9+t*2.4)*amp*0.10;
    const y=top.y+(base.y-top.y)*f;
    pts.push([x,y]);
  }
  return pts;
}
function strokePts(pts,w,col){ ctx.beginPath(); pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.lineWidth=w; ctx.strokeStyle=col; ctx.stroke(); }
function drawSeam(t){
  if(seam<=0.02 || !proj(SEAM.x,0,SEAM.z)) return;
  const pts=seamPoints(t); if(!pts) return;
  ctx.save(); ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.shadowColor='rgba(255,95,150,.95)'; ctx.shadowBlur=(24+34*seam)*DPR;
  strokePts(pts,(8+22*seam)*DPR,`rgba(255,95,150,${0.05+0.10*seam})`);
  strokePts(pts,(3.5+7*seam)*DPR,`rgba(255,110,165,${0.12+0.28*seam})`);
  strokePts(pts,(1.2+2.4*seam)*DPR,`rgba(255,190,215,${0.35+0.6*seam})`);
  for(const b of seamBranch){
    const idx=Math.round(b.f*SEAM.seg), o=pts[idx];
    const len=(pts[SEAM.seg][1]-pts[0][1])*b.len*0.35;
    const bp=[[o[0],o[1]],[o[0]+b.dir*30*DPR*(1+seam),o[1]+len*0.5],
              [o[0]+b.dir*52*DPR*(1+seam)+seamJag[(idx+3)%SEAM.seg]*8,o[1]+len]];
    strokePts(bp,(1.6+3*seam)*DPR,`rgba(255,150,190,${0.10+0.3*seam})`);
  }
  ctx.restore();
}

/* ---------- lore beats ---------- */
const BEATS=[
  {p:0,  s:'Descent initiated'},
  {p:11, s:'Runtime online — reading the distortion field'},
  {p:26, s:'Anchoring city geometry'},
  {p:52, s:'⚠ reality seam detected at grid 0x7F', warn:true},
  {p:72, s:'Assembling the drifter'},
  {p:90, s:'Loop integrity 98% — holding'},
  {p:100,s:'Seam stabilised'},
];

function draw(now){
  const t=(now-t0)/1000;
  ctx.setTransform(1,0,0,1,0,0);

  /* paced target: never faster than MIN_MS, never slower than real download */
  const allowed=Math.min(100, ((now-t0)/MIN_MS)*100);
  const target=Math.min(realP, allowed);
  P+=(target-P)*0.10; if(Math.abs(target-P)<0.25)P=target;
  const p=Math.max(0,Math.min(100,P));
  const bp=p/100;
  descend=Math.min(1,p/8);
  camZ = 120 + bp*760;
  camX = Math.sin(bp*3.4)*520*(0.3+0.7*bp);
  camY = 340*(1-descend) + 150 + Math.sin(t*0.4)*5;

  const baseSeam=(p>48&&p<100)?0.30+0.22*Math.abs(Math.sin(t*1.3)):(p>=100?0.06:0);
  seamSpike*=0.94; if(seamSpike<0.01)seamSpike=0;
  seam=Math.max(baseSeam,seamSpike);

  const sky=ctx.createLinearGradient(0,0,0,H);
  sky.addColorStop(0,'#040713'); sky.addColorStop(.45,'#081226');
  sky.addColorStop(.62,'#0c2038'); sky.addColorStop(1,'#03050c');
  ctx.fillStyle=sky; ctx.fillRect(0,0,W,H);

  const starA=Math.max(0,1-descend*1.6);
  if(starA>0.01) for(const s of stars){
    const tw=.5+.5*Math.sin(t*1.5+s.tw);
    ctx.fillStyle=`rgba(150,190,255,${(0.1+0.5*s.z)*tw*starA})`;
    ctx.beginPath(); ctx.arc(s.x*W,s.y*H,s.z*1.4*DPR,0,6.29); ctx.fill();
  }

  const horizon=H*HORIZON_F;
  const gb=ctx.createLinearGradient(0,horizon-50*DPR,0,horizon+180*DPR);
  gb.addColorStop(0,'rgba(0,120,180,0)'); gb.addColorStop(.5,'rgba(0,150,210,.15)'); gb.addColorStop(1,'rgba(0,60,100,0)');
  ctx.fillStyle=gb; ctx.fillRect(0,horizon-50*DPR,W,240*DPR);

  drawSeam(t);

  ctx.lineWidth=1*DPR;
  for(const r of roads){
    if(bp<r.at) continue;
    const lit=Math.min(1,(bp-r.at)*4);
    ctx.strokeStyle=`rgba(0,200,255,${0.04+0.2*lit})`;
    ctx.beginPath();
    if(r.axis==='x'){const a=proj(-1400,0,r.p),b=proj(1400,0,r.p);if(a&&b){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}}
    else{const a=proj(r.p,0,0),b=proj(r.p,0,2800);if(a&&b){ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);}}
    ctx.stroke();
  }

  for(const b of buildings){
    if(bp<b.buildAt) continue;
    const grow=Math.min(1,(bp-b.buildAt)/0.20);
    const h=b.h*grow; if(h<1) continue;
    const base=proj(b.x,0,b.z), top=proj(b.x,h,b.z);
    if(!base||!top) continue;
    const w=b.w*base.s*0.5; if(w<0.6) continue;
    const g=ctx.createLinearGradient(0,top.y,0,base.y);
    g.addColorStop(0,`rgba(${b.col},.96)`); g.addColorStop(1,'rgba(6,12,22,.96)');
    ctx.fillStyle=g; ctx.fillRect(base.x-w/2,top.y,w,base.y-top.y);
    ctx.fillStyle=`rgba(0,200,255,${0.22+0.35*Math.min(1,grow*1.4)})`;
    ctx.fillRect(base.x-w/2,top.y,w,Math.max(1,1.4*DPR));
    if(w>7*DPR && grow>.62){
      const rows=Math.min(15,Math.floor((base.y-top.y)/(9*DPR)));
      const cols=Math.max(1,Math.floor(w/(7*DPR)));
      const on=Math.floor(b.seed%4);
      for(let rr=0;rr<rows;rr++)for(let cc=0;cc<cols;cc++){
        if(((rr*7+cc*13+on)%5)===0){
          ctx.fillStyle=`rgba(140,240,255,${0.05+0.22*b.win})`;
          ctx.fillRect(base.x-w/2+cc*(w/cols)+1.4*DPR, top.y+rr*9*DPR+2*DPR, Math.max(1,w/cols-3*DPR), 3*DPR);
        }
      }
    }
    if(b.glow && grow>.9){
      ctx.beginPath(); ctx.arc(base.x,top.y,2.2*DPR,0,6.29);
      ctx.fillStyle='#ff5f96'; ctx.shadowColor='#ff5f96'; ctx.shadowBlur=16*DPR; ctx.fill(); ctx.shadowBlur=0;
    }
  }

  if(descend<1){
    const cd=1-descend;
    for(const c of clouds){
      c.z-=0.0024*c.v*(0.5+cd); if(c.z<-0.1) c.z=1.05;
      const s=1/(c.z+0.15);
      const px=W/2+c.x*s*W*0.42;
      const py=H*0.5+c.y*s*H*0.42+(1-cd)*H*0.3;
      const rad=c.r*s*DPR*0.5;
      const cg=ctx.createRadialGradient(px,py,0,px,py,rad);
      const al=c.a*(0.35+cd*0.85);
      cg.addColorStop(0,`rgba(190,230,255,${al})`); cg.addColorStop(1,'rgba(190,230,255,0)');
      ctx.fillStyle=cg; ctx.beginPath(); ctx.arc(px,py,rad,0,6.29); ctx.fill();
    }
  }

  const bf=ctx.createLinearGradient(0,H*0.6,0,H);
  bf.addColorStop(0,'rgba(3,5,12,0)'); bf.addColorStop(1,'rgba(3,5,12,.92)');
  ctx.fillStyle=bf; ctx.fillRect(0,H*0.6,W,H*0.4);

  if(glitchAmt>0.01){
    for(let i=0;i<7;i++){
      const yy=Math.random()*H, hh=(2+Math.random()*16)*DPR, dx=(Math.random()-.5)*46*DPR*glitchAmt;
      ctx.drawImage(cv,0,yy,W,hh,dx,yy,W,hh);
    }
  }

  drawLog();

  barFl.style.width=p+'%';
  pctEl.textContent=Math.round(p)+'%';
  if(totalBytes){
    const loaded=Math.min(totalBytes, totalBytes*p/100);
    if(p<100) subEl.textContent = mb(loaded)+' / '+mb(totalBytes);
    else subEl.textContent='anchor locked';
  }

  let bt=BEATS[0];
  BEATS.forEach(b=>{if(p>=b.p)bt=b;});
  if(beatEl.dataset.cur!==bt.s){
    beatEl.dataset.cur=bt.s;
    beatEl.innerHTML=`<div class="${bt.warn?'warn':''}">${bt.s}</div>`;
    if(bt.warn){ glitch(1); flash(.3); seamSpike=1; }
    else if(p<100) glitch(.45);
  }

  anchorEl.textContent = p>=100?'LOCKED' : (p>=58&&p<74)?'SEAM FAULT' : 'SYNCING';
  anchorEl.style.color = p>=100?'#7dffb0' : (p>=58&&p<74)?'#ff5f96' : '#8ff8ff';

  if(p>=100 && !done){
    done=true; seamSpike=1; glitch(1);
    setTimeout(()=>{flash(.35,'#8ff8ff'); glitch(1);},120);
    setTimeout(()=>{document.getElementById('enter').style.display='flex';},1100);
  }

  requestAnimationFrame(draw);
}
requestAnimationFrame(draw);

document.getElementById('enter').addEventListener('click',()=>{
  if(entered) return; entered=true; location.reload();
});
