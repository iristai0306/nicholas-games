<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:#0b1220;overflow:hidden}canvas{display:block}</style>
</head><body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script>
const W = 900, H = 460;
const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, preserveDrawingBuffer:true});
renderer.setPixelRatio(2);
renderer.setSize(W, H);
renderer.setClearColor(0x0b1220, 1);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, W/H, 0.1, 100);
camera.position.set(0, 1.05, 4.5);
camera.lookAt(0, 0.72, 0);

scene.add(new THREE.HemisphereLight(0xb6d4ff, 0x0d1522, 1.25));
const key = new THREE.DirectionalLight(0xfff2dc, 1.5); key.position.set(-3.5, 6, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0x6fb8ff, 0.9); fill.position.set(4.5, 3, -3); scene.add(fill);
const kick = new THREE.DirectionalLight(0xff7a8c, 0.7); kick.position.set(4, 1.6, 4); scene.add(kick);

const MODELS = {};
const NAMES = ["pleb_basic","pleb_brute","pleb_king","pleb_scout"];
let pending = NAMES.length;
const loader = new THREE.GLTFLoader();
NAMES.forEach(n=>loader.load("pleb-td/models/"+n+".glb", g=>{
  MODELS[n] = g.scene; if(--pending===0) build();
}, undefined, e=>{ console.warn("fail",n); if(--pending===0) build(); }));

function tint(obj, hex, amt){
  obj.traverse(o=>{
    if(o.isMesh && o.material){
      const mats = Array.isArray(o.material)?o.material:[o.material];
      const out = mats.map(m=>{
        const c = m.clone();
        if(c.color) c.color.lerp(new THREE.Color(hex), amt===undefined?0.55:amt);
        c.roughness = 0.6;
        return c;
      });
      o.material = Array.isArray(o.material) ? out : out[0];
    }
  });
}

function shadowBlob(x, z, s, op){
  const m = new THREE.Mesh(
    new THREE.CircleGeometry(1, 32),
    new THREE.MeshBasicMaterial({color:0x000000, transparent:true, opacity:op, depthWrite:false})
  );
  m.rotation.x = -Math.PI/2;
  m.scale.set(s, s*0.55, 1);
  m.position.set(x, 0.002, z);
  scene.add(m);
}

function build(){
  const A = (MODELS.pleb_basic||MODELS.pleb_brute).clone(true);
  const B = (MODELS.pleb_brute||MODELS.pleb_basic).clone(true);

  A.scale.setScalar(1.02);
  A.position.set(-0.66, 0, 0.10);
  A.rotation.y = -1.15;
  tint(A, 0x38d4ff, 0.38);

  B.scale.setScalar(1.02);
  B.position.set(0.72, 0, -0.05);
  B.rotation.y = 1.15;
  tint(B, 0xff3355, 0.55);

  scene.add(A, B);

  shadowBlob(-0.66, 0.10, 0.62, 0.30);
  shadowBlob( 0.72,-0.05, 0.62, 0.30);

  // impact burst at the point between them
  const burst = new THREE.Group();
  burst.position.set(0.02, 1.02, 0.05);
  const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.10, 0),
    new THREE.MeshBasicMaterial({color:0xfff6c2}));
  burst.add(core);
  for(let i=0;i<9;i++){
    const a = (i/9) * Math.PI * 2 + 0.4;
    const len = 0.20 + (i%3)*0.09;
    const spike = new THREE.Mesh(
      new THREE.ConeGeometry(0.033, len, 4),
      new THREE.MeshBasicMaterial({color: i%2 ? 0xffd15c : 0xfff3b0})
    );
    spike.position.set(Math.cos(a)*len*0.55, Math.sin(a)*len*0.55, 0);
    spike.rotation.z = a - Math.PI/2;
    burst.add(spike);
  }
  const glow = new THREE.Mesh(new THREE.SphereGeometry(0.30, 16, 16),
    new THREE.MeshBasicMaterial({color:0xffbe4d, transparent:true, opacity:0.18}));
  burst.add(glow);
  scene.add(burst);

  renderer.render(scene, camera);
  window.__ready = true;
}
</script>
</body></html>
