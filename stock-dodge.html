<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#070910">
<title>STOCK DODGE</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Trebuchet MS',system-ui,-apple-system,sans-serif;
  background:#070910;color:#eef1f7;
  user-select:none;-webkit-user-select:none;touch-action:manipulation;
}
.wrap{height:100%;display:flex;flex-direction:column;padding:12px 14px calc(12px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;font-size:11px;letter-spacing:.2em;color:#5f6b85;padding-bottom:10px}
.brand{color:#54e0a0;font-weight:900;letter-spacing:.14em}
.best{font-variant-numeric:tabular-nums}

/* timer */
.tbar{height:4px;background:#141a28;border-radius:99px;overflow:hidden;margin-bottom:14px}
.tfill{height:100%;width:100%;background:linear-gradient(90deg,#54e0a0,#f5c451 65%,#ff5f6d);transition:width .12s linear}

/* value block */
.valblock{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2px}
.total{font-size:clamp(32px,10vw,44px);font-weight:900;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1;transition:color .2s}
.pl{font-size:13px;font-weight:800;letter-spacing:.04em;font-variant-numeric:tabular-nums;padding:4px 0}
.up{color:#54e0a0}.down{color:#ff5f6d}.flat{color:#5f6b85}

.subline{display:flex;gap:14px;font-size:11px;letter-spacing:.1em;color:#5f6b85;margin-bottom:12px}
.subline b{color:#9fb0cc;font-variant-numeric:tabular-nums}

/* chart */
.chartwrap{flex:1;position:relative;min-height:120px;margin-bottom:16px;border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0b0f18,#080b13);border:1px solid #151c2b}
#chart{display:block;width:100%;height:100%}
.news{
  position:absolute;left:0;right:0;top:10px;text-align:center;font-size:11px;font-weight:900;
  letter-spacing:.14em;padding:5px 0;opacity:0;transition:opacity .2s;pointer-events:none;
  text-transform:uppercase;
}
.news.show{opacity:1}
.news.good{color:#54e0a0;background:linear-gradient(90deg,transparent,rgba(84,224,160,.13),transparent)}
.news.bad{color:#ff5f6d;background:linear-gradient(90deg,transparent,rgba(255,95,109,.13),transparent)}

/* buttons */
.trade{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:9px}
.big{display:grid;grid-template-columns:1fr 1fr;gap:9px}
button{
  border:0;border-radius:14px;font-family:inherit;font-weight:800;letter-spacing:.06em;
  cursor:pointer;transition:transform .08s,filter .15s;padding:15px 8px;font-size:14px;
  color:#eef1f7;background:#131a28;
}
button:active{transform:scale(.97)}
button:disabled{opacity:.32;pointer-events:none}
.b{background:#0f2a20;color:#54e0a0;border:1px solid #1c4a37}
.s{background:#2a1218;color:#ff7b86;border:1px solid #4a1c25}
.big .b{background:#54e0a0;color:#06251a;border:0}
.big .s{background:#ff5f6d;color:#2a0508;border:0}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(5,7,12,.9);backdrop-filter:blur(8px);display:none;align-items:center;justify-content:center;padding:24px;z-index:30}
.overlay.show{display:flex}
.card{width:100%;max-width:340px;background:#0e131e;border:1px solid #1d2637;border-radius:22px;padding:26px 22px;text-align:center;box-shadow:0 30px 70px -25px #000}
.otitle{font-size:12px;letter-spacing:.3em;font-weight:900;color:#5f6b85;margin-bottom:12px}
.oamt{font-size:clamp(36px,12vw,50px);font-weight:900;font-variant-numeric:tabular-nums;letter-spacing:-.02em;margin-bottom:6px;line-height:1}
.mult{font-size:14px;font-weight:900;letter-spacing:.1em;margin-bottom:16px}
.osub{font-size:13px;color:#7b87a0;line-height:1.65;margin-bottom:20px}
.osub b{color:#c3cee0}
.rules{font-size:12px;color:#7b87a0;line-height:1.75;text-align:left;background:#0a0e17;border:1px solid #161d2b;border-radius:14px;padding:14px 16px;margin-bottom:20px}
.rules b{color:#54e0a0}
.card button{width:100%;padding:16px;font-size:16px;background:linear-gradient(180deg,#6ef0b4,#35c98a);color:#04241a;box-shadow:0 10px 26px -10px rgba(84,224,160,.7)}
.mute{position:fixed;top:10px;right:10px;width:44px;height:26px;border-radius:99px;background:#121a28;border:1px solid #1d2637;color:#5f6b85;font-size:9px;letter-spacing:.1em;padding:0;z-index:40;display:none}
</style>
</head>
<body>
<div class="wrap">

  <div class="top">
    <div class="brand">STOCK DODGE</div>
    <div class="best" id="best">BEST 1.00x</div>
  </div>

  <div class="tbar"><div class="tfill" id="tfill"></div></div>

  <div class="valblock">
    <div class="total" id="total">$100.00</div>
    <div class="pl flat" id="pl">+$0.00</div>
  </div>

  <div class="subline">
    <div>PRICE <b id="price">$20.00</b></div>
    <div>SHARES <b id="shares">0</b></div>
    <div>CASH <b id="cash">$100.00</b></div>
  </div>

  <div class="chartwrap">
    <canvas id="chart"></canvas>
    <div class="news" id="news"></div>
  </div>

  <div class="trade">
    <button class="b" id="buy1">BUY 1</button>
    <button class="s" id="sell1">SELL 1</button>
  </div>
  <div class="big">
    <button class="b" id="buyAll">ALL IN</button>
    <button class="s" id="sellAll">ALL OUT</button>
  </div>

</div>

<button class="mute" id="mute">SND</button>

<div class="overlay show" id="overlay">
  <div class="card">
    <div class="otitle" id="otitle">STOCK DODGE</div>
    <div class="oamt" id="oamt">$100.00</div>
    <div class="mult" id="mult"></div>
    <div class="osub" id="osub"></div>
    <div class="rules" id="rules">
      You get <b>$100</b> and <b>60 seconds</b>.<br>
      Buy low, sell high. Timing is everything.<br>
      Whatever you're holding at the bell is what you keep.
    </div>
    <button id="startBtn">START</button>
  </div>
</div>

<script>
(function(){
  'use strict';

  var ROUND = 60;          // seconds
  var TICK = 0.12;         // seconds per price update
  var START_CASH = 100;
  var START_PRICE = 20;

  var el = function(id){ return document.getElementById(id); };
  var totalEl=el('total'), plEl=el('pl'), priceEl=el('price'), sharesEl=el('shares'),
      cashEl=el('cash'), bestEl=el('best'), tfill=el('tfill'), newsEl=el('news'),
      overlay=el('overlay'), otitle=el('otitle'), oamt=el('oamt'), multEl=el('mult'),
      osub=el('osub'), rulesEl=el('rules'), startBtn=el('startBtn'), muteBtn=el('mute'),
      cv=el('chart');
  var ctx = cv.getContext('2d');

  var S = {
    price: START_PRICE, cash: START_CASH, shares: 0, cost: 0,
    hist: [], t: 0, running: false, drift: 0, driftTicks: 0,
    nextEvent: 0, muted: false, dpr: 1
  };

  var best = Number(localStorage.getItem('stockDodgeBest') || 1) || 1;

  /* ---------- audio ---------- */
  var actx = null;
  function beep(f, d, type, v){
    if (S.muted) return;
    try{
      if (!actx) actx = new (window.AudioContext||window.webkitAudioContext)();
      var o = actx.createOscillator(), g = actx.createGain();
      o.type = type || 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(v || 0.06, actx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + d);
      o.connect(g); g.connect(actx.destination);
      o.start(); o.stop(actx.currentTime + d);
    }catch(e){}
  }

  /* ---------- canvas sizing ---------- */
  function sizeCanvas(){
    var r = cv.getBoundingClientRect();
    S.dpr = window.devicePixelRatio || 1;
    cv.width = Math.max(1, Math.round(r.width * S.dpr));
    cv.height = Math.max(1, Math.round(r.height * S.dpr));
    ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
    S.W = r.width; S.H = r.height;
  }
  window.addEventListener('resize', sizeCanvas);

  /* ---------- money ---------- */
  function money(n){
    n = Math.round(n*100)/100;
    return '$' + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
  }
  function total(){ return S.cash + S.shares * S.price; }

  /* ---------- ui ---------- */
  function updateUI(){
    var tot = total();
    var pl = tot - START_CASH;
    totalEl.textContent = money(tot);
    plEl.textContent = (pl >= 0 ? '+' : '-') + money(Math.abs(pl)).slice(1);
    plEl.className = 'pl ' + (pl > 0.005 ? 'up' : pl < -0.005 ? 'down' : 'flat');
    totalEl.style.color = pl > 0.005 ? '#54e0a0' : pl < -0.005 ? '#ff5f6d' : '#eef1f7';
    priceEl.textContent = money(S.price);
    sharesEl.textContent = S.shares;
    cashEl.textContent = money(S.cash);
    bestEl.textContent = 'BEST ' + best.toFixed(2) + 'x';

    var rate = S.t / ROUND;
    tfill.style.width = Math.max(0, (1-rate)*100) + '%';

    var live = S.running;
    el('buy1').disabled   = !live || S.cash < S.price;
    el('sell1').disabled  = !live || S.shares < 1;
    el('buyAll').disabled = !live || S.cash < S.price;
    el('sellAll').disabled= !live || S.shares < 1;
  }

  /* ---------- chart ---------- */
  function draw(){
    var W = S.W || 300, H = S.H || 200;
    ctx.clearRect(0,0,W,H);

    var win = S.hist.slice(-150);
    if (win.length < 2){ updateOnlyGrid(W,H); return; }

    var mn = Math.min.apply(null, win), mx = Math.max.apply(null, win);
    var pad = Math.max((mx-mn)*0.14, 0.4);
    mn -= pad; mx += pad;
    var span = mx - mn;

    var X = function(i){ return (i/(win.length-1)) * (W-2) + 1; };
    var Y = function(p){ return H - 10 - ((p-mn)/span) * (H-20); };

    /* grid */
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    for (var g=1; g<5; g++){
      var gy = (H/5)*g;
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
    }

    var last = win[win.length-1];
    var up = last >= win[0];
    var col = up ? '#54e0a0' : '#ff5f6d';

    /* fill */
    var grad = ctx.createLinearGradient(0,0,0,H);
    grad.addColorStop(0, up ? 'rgba(84,224,160,0.26)' : 'rgba(255,95,109,0.26)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.beginPath();
    ctx.moveTo(X(0), Y(win[0]));
    for (var i=1;i<win.length;i++) ctx.lineTo(X(i), Y(win[i]));
    ctx.lineTo(X(win.length-1), H);
    ctx.lineTo(X(0), H);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();

    /* line */
    ctx.beginPath();
    ctx.moveTo(X(0), Y(win[0]));
    for (var j=1;j<win.length;j++) ctx.lineTo(X(j), Y(win[j]));
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.2;
    ctx.lineJoin = 'round';
    ctx.lineCap = 'round';
    ctx.shadowColor = col;
    ctx.shadowBlur = 12;
    ctx.stroke();
    ctx.shadowBlur = 0;

    /* avg cost line */
    if (S.shares > 0 && S.cost > 0){
      var avg = S.cost / S.shares;
      if (avg > mn && avg < mx){
        var ay = Y(avg);
        ctx.setLineDash([5,5]);
        ctx.strokeStyle = 'rgba(255,255,255,0.42)';
        ctx.lineWidth = 1.4;
        ctx.beginPath(); ctx.moveTo(0,ay); ctx.lineTo(W,ay); ctx.stroke();
        ctx.setLineDash([]);
        ctx.fillStyle = 'rgba(255,255,255,0.55)';
        ctx.font = '600 9px Trebuchet MS, sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('YOUR AVERAGE', 6, ay - 4);
      }
    }

    /* head dot */
    var hx = X(win.length-1), hy = Y(last);
    ctx.beginPath();
    ctx.arc(hx, hy, 4.5, 0, Math.PI*2);
    ctx.fillStyle = col;
    ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function updateOnlyGrid(W,H){
    ctx.strokeStyle = 'rgba(255,255,255,0.045)';
    ctx.lineWidth = 1;
    for (var g=1; g<5; g++){
      var gy = (H/5)*g;
      ctx.beginPath(); ctx.moveTo(0,gy); ctx.lineTo(W,gy); ctx.stroke();
    }
  }

  /* ---------- price engine ---------- */
  var NEWS = [
    ['CEO TWEET STORM', 1],
    ['BIG BUYER SPOTTED', 1],
    ['EARNINGS BEAT', 1],
    ['HYPE TRAIN LEAVING', 1],
    ['RUMOUR: RECALL', -1],
    ['COPYRIGHT STRIKE', -1],
    ['SECRETARY SOLD EVERYTHING', -1],
    ['BAD REVIEW LEAKED', -1]
  ];

  function tick(){
    if (!S.running) return;

    S.t += TICK;

    var prog = Math.min(1, S.t / ROUND);
    var vol = 0.0045 + 0.0135 * prog;          // gets wilder as the clock runs down

    /* events */
    if (S.nextEvent > 0){ S.nextEvent--; }
    else {
      var pick = NEWS[Math.floor(Math.random()*NEWS.length)];
      S.drift = 0.0075 * pick[1];
      S.driftTicks = 34;
      S.nextEvent = 55 + Math.floor(Math.random()*60);
      flashNews(pick[0], pick[1] > 0);
    }
    if (S.driftTicks > 0){ S.driftTicks--; }
    else { S.drift = 0; }

    var meanRev = (START_PRICE - S.price) / START_PRICE * 0.0009;
    var noise = (Math.random()*2 - 1) * vol;

    S.price *= (1 + noise + meanRev + S.drift);
    S.price = Math.max(1.5, Math.min(400, S.price));

    S.hist.push(S.price);
    if (S.hist.length > 400) S.hist.shift();

    updateUI();
    draw();

    if (S.t >= ROUND) endRound();
  }

  var newsTimer = null;
  function flashNews(txt, good){
    newsEl.textContent = txt;
    newsEl.className = 'news show ' + (good ? 'good' : 'bad');
    clearTimeout(newsTimer);
    newsTimer = setTimeout(function(){ newsEl.className = 'news ' + (good?'good':'bad'); }, 2200);
  }

  /* ---------- trading ---------- */
  function buy(n){
    if (!S.running) return;
    var can = Math.floor(S.cash / S.price);
    n = Math.min(n, can);
    if (n <= 0){ beep(180,0.08,'square',0.04); return; }
    S.cash -= n * S.price;
    S.cost += n * S.price;
    S.shares += n;
    beep(520, 0.07, 'sine', 0.05);
    updateUI(); draw();
  }
  function sell(n){
    if (!S.running) return;
    n = Math.min(n, S.shares);
    if (n <= 0){ beep(180,0.08,'square',0.04); return; }
    var avg = S.cost / S.shares;
    S.cash += n * S.price;
    S.cost -= n * avg;
    S.shares -= n;
    if (S.shares === 0) S.cost = 0;
    beep(760, 0.08, 'sine', 0.05);
    updateUI(); draw();
  }

  /* ---------- round ---------- */
  function startRound(){
    S.price = START_PRICE;
    S.cash = START_CASH;
    S.shares = 0;
    S.cost = 0;
    S.hist = [START_PRICE];
    S.t = 0;
    S.drift = 0; S.driftTicks = 0;
    S.nextEvent = 70 + Math.floor(Math.random()*40);
    S.running = true;
    overlay.classList.remove('show');
    sizeCanvas();
    updateUI();
    draw();
    clearInterval(S.timer);
    S.timer = setInterval(tick, TICK*1000);
  }

  function endRound(){
    S.running = false;
    clearInterval(S.timer);

    var tot = total();
    var mult = tot / START_CASH;
    var isBest = mult > best;
    if (isBest){
      best = mult;
      try{ localStorage.setItem('stockDodgeBest', String(best)); }catch(e){}
    }

    otitle.textContent = mult >= 1 ? 'CLOCK STOPPED' : 'CLOCK STOPPED';
    otitle.style.color = mult >= 1 ? '#54e0a0' : '#ff5f6d';
    oamt.textContent = money(tot);
    oamt.style.color = mult >= 1 ? '#54e0a0' : '#ff5f6d';
    multEl.textContent = (isBest ? 'NEW BEST  ' : '') + mult.toFixed(2) + 'x';
    multEl.style.color = isBest ? '#f5c451' : '#5f6b85';

    var verdict;
    if (mult >= 2) verdict = 'That is genuinely excellent. You read the chart.';
    else if (mult >= 1.5) verdict = 'Strong run. You kept your head when it got wild.';
    else if (mult >= 1.05) verdict = 'You beat the start. Small win is still a win.';
    else if (mult >= 0.95) verdict = 'Flat. You basically stood still and watched.';
    else if (mult >= 0.6) verdict = 'You bought near the top, didn\'t you. We\'ve all done it.';
    else verdict = 'Ouch. You held something that was falling. Classic mistake.';

    osub.innerHTML = 'Start: <b>$100.00</b> &nbsp; End: <b>' + money(tot) + '</b><br>' + verdict;
    rulesEl.style.display = 'none';
    startBtn.textContent = 'RUN IT AGAIN';
    overlay.classList.add('show');
    updateUI();
  }

  /* ---------- wire up ---------- */
  el('buy1').addEventListener('click', function(){ buy(1); });
  el('sell1').addEventListener('click', function(){ sell(1); });
  el('buyAll').addEventListener('click', function(){ buy(9999); });
  el('sellAll').addEventListener('click', function(){ sell(9999); });
  startBtn.addEventListener('click', startRound);

  muteBtn.addEventListener('click', function(){
    S.muted = !S.muted;
    muteBtn.textContent = S.muted ? 'MUTE' : 'SND';
  });
  if (window.matchMedia('(min-width: 560px)').matches) muteBtn.style.display = 'block';

  document.addEventListener('keydown', function(e){
    if (e.code === 'KeyB') buy(1);
    if (e.code === 'KeyS') sell(1);
  });

  /* boot */
  sizeCanvas();
  S.hist = [START_PRICE];
  updateUI();
  draw();
  setTimeout(sizeCanvas, 60);
})();
</script>
</body>
</html>
