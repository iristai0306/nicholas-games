<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"/>
<meta name="theme-color" content="#0b0a14"/>
<title>Build a Beast</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{background:radial-gradient(900px 600px at 50% -10%,#2a1740 0%,#0f0a1a 55%,#07050d 100%);
  color:#eef0ff;font-family:ui-rounded,'Segoe UI',system-ui,-apple-system,sans-serif;user-select:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#app{display:flex;flex-direction:column;height:100%;max-width:560px;margin:0 auto;position:relative}
.hdr{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;font-size:13px}
.hdr .logo{font-weight:800;letter-spacing:.5px}
.hdr .logo b{color:#c9a7ff}
.hdr .st{color:#9a90b8;text-align:right;font-weight:700}
.hdr .st b{color:#eef0ff}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:8px 14px 14px;z-index:10;
  background:radial-gradient(900px 600px at 50% 0%,#2a1740,#0f0a1a 60%,#07050d)}
.screen.on{display:flex}
.scroll{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;min-height:0}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:9px;padding:4px 0 12px}
.pcard{background:linear-gradient(180deg,#1d1630,#141024);border:1px solid #2d2447;border-radius:14px;
  padding:5px 4px 4px;cursor:pointer;transition:.15s;position:relative}
.pcard:active{transform:scale(.95)}
.pcard.sel{border-color:#c9a7ff;box-shadow:0 0 0 2px rgba(201,167,255,.4),0 0 20px rgba(201,167,255,.3)}
.pcard svg{width:100%;height:auto;display:block}
.pcard .nm{font-size:10px;color:#9a90b8;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .lv{position:absolute;top:3px;left:5px;font-size:9px;font-weight:900;color:#ffd75a}
.title{font-size:17px;font-weight:800;margin:6px 0 2px}
.sub{font-size:12px;color:#9a90b8;margin-bottom:8px;line-height:1.5}
button{font-family:inherit;font-weight:800;letter-spacing:.4px;border:none;border-radius:13px;
  padding:14px 18px;font-size:15px;cursor:pointer;transition:.15s;
  background:linear-gradient(180deg,#c9a7ff,#8a5cf0);color:#150a2b}
button:active{transform:scale(.97)}
button:disabled{background:#241c3a;color:#5d5478}
button.ghost{background:transparent;color:#9a90b8;border:1px solid #2d2447}
.btnrow{display:flex;gap:9px;margin-top:auto;padding-top:10px}
.btnrow button{flex:1}

/* ARENA */
#arena{display:none;flex-direction:column;height:100%;padding:6px 10px 10px}
#arena.on{display:flex}
.fighters{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;padding:2px 4px}
.fighter{width:44%;display:flex;flex-direction:column;align-items:center;position:relative}
.fighter svg{width:100%;height:auto;max-height:21vh;transition:transform .18s}
.fighter.hit svg{animation:shake .28s}
.fighter.ko svg{opacity:.25;filter:grayscale(1)}
.fighter.atk-r svg{animation:lungeR .32s}
.fighter.atk-l svg{animation:lungeL .32s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-9px)}50%{transform:translateX(7px)}75%{transform:translateX(-4px)}}
@keyframes lungeR{0%,100%{transform:translate(0,0)}45%{transform:translate(46px,-14px) scale(1.1)}}
@keyframes lungeL{0%,100%{transform:translate(0,0)}45%{transform:translate(-46px,-14px) scale(1.1)}}
.fname{font-size:12px;font-weight:800;margin-top:2px;text-align:center;line-height:1.2}
.hpwrap{width:100%;height:11px;background:#241c3a;border-radius:99px;overflow:hidden;margin-top:4px;border:1px solid #332a4e}
.hpbar{height:100%;width:100%;transition:width .35s;background:linear-gradient(90deg,#3de08a,#5ef2a8)}
.hpbar.low{background:linear-gradient(90deg,#ff5e5e,#ff9a5e)}
.hptxt{font-size:10px;color:#9a90b8;margin-top:2px;font-weight:700}
.vs{font-size:12px;font-weight:900;color:#5d5478;padding-bottom:30px}

#log{flex:1;overflow-y:auto;min-height:0;margin:8px 0;padding:8px 10px;
  background:rgba(12,8,24,.6);border:1px solid #241c3a;border-radius:12px;font-size:12.5px;line-height:1.6}
#log div{margin-bottom:3px;animation:fadein .2s}
#log .dmg{color:#ff9a9a;font-weight:700}
#log .good{color:#5ef2a8;font-weight:700}
#log .crit{color:#ffd75a;font-weight:900}
#log .dim{color:#7d7398}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}to{opacity:1}}

.moves{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.mv{padding:13px 6px;font-size:13px;border-radius:12px;border:1px solid #3a2d5e;
  background:linear-gradient(180deg,#241a3c,#181128);color:#eef0ff;font-weight:800;line-height:1.25}
.mv small{display:block;font-size:9.5px;color:#9a90b8;font-weight:600;margin-top:2px}
.mv:disabled{opacity:.35}
.overlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;background:rgba(7,5,13,.9);padding:24px;text-align:center;z-index:30}
.overlay.on{display:flex}
.overlay h2{margin:0;font-size:26px}
.overlay p{margin:0;color:#9a90b8;font-size:14px;line-height:1.6;max-width:320px}
.traitlist{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.chip{font-size:9.5px;letter-spacing:.3px;color:#9a90b8;background:rgba(255,255,255,.05);
  border:1px solid #2d2447;padding:3px 8px;border-radius:99px;text-transform:uppercase}
.statrow{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid #241c3a;font-size:13px}
.statrow span:first-child{color:#9a90b8}
.statrow span:last-child{font-weight:800}
#previewBox{width:min(38vw,150px);margin:0 auto}
#previewBox svg{width:100%;height:auto}
.toast{position:absolute;left:50%;bottom:86px;transform:translateX(-50%) translateY(10px);opacity:0;
  background:rgba(30,22,50,.97);border:1px solid #3a2d5e;padding:9px 16px;border-radius:11px;
  font-size:12.5px;font-weight:700;transition:.25s;pointer-events:none;z-index:40;white-space:nowrap}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
  <div class="hdr">
    <div class="logo">⚔️ BUILD<b>A</b>BEAST</div>
    <div class="st">WAVE <b id="hWave">-</b> · BEST <b id="hBest">0</b></div>
  </div>

  <!-- PICK -->
  <div class="screen on" id="scrPick">
    <div class="title">Choose your beast</div>
    <div class="sub">Straight out of your Mutant Zoo. Traits become stats.</div>
    <div class="scroll"><div class="pickgrid" id="pickGrid"></div></div>
    <div class="btnrow">
      <button id="btnGo" disabled>ENTER THE ARENA</button>
    </div>
  </div>

  <!-- ARENA -->
  <div id="arena">
    <div class="fighters">
      <div class="fighter" id="fL">
        <div id="svgL"></div>
        <div class="fname" id="nameL">—</div>
        <div class="hpwrap"><div class="hpbar" id="hpL"></div></div>
        <div class="hptxt" id="hpTxtL">—</div>
      </div>
      <div class="vs">VS</div>
      <div class="fighter" id="fR">
        <div id="svgR"></div>
        <div class="fname" id="nameR">—</div>
        <div class="hpwrap"><div class="hpbar" id="hpR"></div></div>
        <div class="hptxt" id="hpTxtR">—</div>
      </div>
    </div>
    <div id="log"></div>
    <div class="moves">
      <button class="mv" id="mvStrike">STRIKE<small>reliable</small></button>
      <button class="mv" id="mvGuard">GUARD<small>heal 15%</small></button>
      <button class="mv" id="mvSpecial">—<small>∞ cooldown</small></button>
    </div>
  </div>

  <div class="overlay" id="ovResult">
    <h2 id="ovTitle">—</h2>
    <p id="ovText">—</p>
    <button id="ovNext">CONTINUE</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script>
"use strict";
/* ============ TRAITS ============ */
const T = {
  body:    ['blob','tall','wide','bug','slug'],
  head:    ['round','dome','blocky','spiky'],
  eyes:    ['one','two','three','big','stalk'],
  limbs:   ['none','two','four','six','tentacle'],
  pattern: ['none','spots','stripes','checker'],
  horns:   ['none','two','one','antlers'],
  tail:    ['none','curl','spike','bushy'],
  palette: [0,1,2,3,4,5,6,7]
};
const KEYS = Object.keys(T);

const PAL = [
  ['#7ef2a1','#2fa96b','#0d3b23'], // 0 mint
  ['#8fd4ff','#2f8dc4','#0b2b3d'], // 1 sky
  ['#ffb3d1','#e2649c','#3d0b22'], // 2 pink
  ['#ffd98f','#d99a2b','#3d2a05'], // 3 gold
  ['#c9a7ff','#7d4fd6','#1f0b3d'], // 4 violet
  ['#ff9c8f','#d14634','#3d0f0a'], // 5 coral
  ['#bdf2e6','#4fb3a3','#0b3330'], // 6 teal
  ['#d8d8e8','#8a8aa0','#24242e'], // 7 bone
];
const PALNAMES=['MINT','SKY','ROSE','GOLD','VIOLET','CORAL','TEAL','BONE'];

const MAXZOO=40, MUT=0.14;

/* ============ GENOME ============ */
let uid=1;
function randOf(a){return a[Math.floor(Math.random()*a.length)]}
function newGenome(){
  const g={id:uid++};
  for(const k of KEYS) g[k]=randOf(T[k]);
  g.name=nameFor(g);
  return g;
}
function hash(g){
  return KEYS.map(k=>g[k]).join('|');
}
function rarityOf(child,a,b){
  let m=0;
  for(const k of KEYS) if(child[k]!==a[k] && child[k]!==b[k]) m++;
  if(m>=4) return {key:'legendary',label:'LEGENDARY',muts:m};
  if(m===3) return {key:'rare',label:'RARE',muts:m};
  if(m===2) return {key:'uncommon',label:'UNCOMMON',muts:m};
  return {key:'common',label:'COMMON',muts:m};
}

/* ============ NAMES ============ */
const PRE=['Gloop','Zorp','Blix','Murk','Snib','Quaz','Vex','Wob','Grub','Flomp','Kron','Nub','Thwack','Yip','Bleb','Snorp','Zib','Mung','Flark','Grib'];
const SUF=['o','us','ax','ith','orp','oid','ling','apod','zilla','mite','on','ux','el','ara','og'];
function nameFor(g){
  const p=PRE[(g.body?T.body.indexOf(g.body):0)*3%PRE.length];
  let n=p+SURF();
  return n.charAt(0).toUpperCase()+n.slice(1);
}
function SURF(){
  const s=SURF_POOL[Math.floor(Math.random()*SURF_POOL.length)];
  return s;
}
const SURF_POOL=['o','us','ax','ith','orp','oid','ling','apod','zilla','mite','on','ux','el','ara','og','ik','ump'];


/* ============ SVG RENDERER ============ */
let cid=0;

function bodyShape(t,fill,extra){
  const f=`fill="${fill}" ${extra||''}`;
  switch(t){
    case 'blob': return `<ellipse cx="60" cy="74" rx="34" ry="26" ${f}/>`;
    case 'tall': return `<rect x="36" y="46" width="48" height="54" rx="22" ${f}/>`;
    case 'wide': return `<ellipse cx="60" cy="79" rx="43" ry="22" ${f}/>`;
    case 'bug':  return `<circle cx="60" cy="73" r="28" ${f}/>`;
    case 'slug': return `<path d="M17 98 Q17 54 60 54 Q103 54 103 98 Z" ${f}/>`;
    default:     return `<ellipse cx="60" cy="74" rx="34" ry="26" ${f}/>`;
  }
}

/* head top y for each head shape */
const HEADTOP={round:9,dome:8,blocky:10,spiky:6};

function headShape(t,fill,line){
  const st=`fill="${fill}" stroke="${line}" stroke-width="2" stroke-linejoin="round"`;
  switch(t){
    case 'round': return `<circle cx="60" cy="31" r="22" ${st}/>`;
    case 'dome':  return `<path d="M38 52 L38 30 A22 22 0 0 1 82 30 L82 52 Z" ${st}/>`;
    case 'blocky':return `<rect x="36" y="10" width="48" height="42" rx="12" ${st}/>`;
    case 'spiky': return `<path d="M60 6 L76 17 L86 32 L76 52 L44 52 L34 32 L44 17 Z" ${st}/>`;
  }
  return '';
}

/* per-body geometry: left edge, bottom edge, width */
const BODY={ blob:{l:26,b:100,w:68}, tall:{l:36,b:100,w:48}, wide:{l:17,b:101,w:86}, bug:{l:32,b:101,w:56}, slug:{l:17,b:98,w:86} };
function bg(g){return BODY[g.body]||BODY.blob}

function legsFor(g,accent,dark){
  const n={none:0,two:2,four:4,six:6,tentacle:3}[g.limbs];
  if(!n) return '';
  const b=bg(g);
  if(g.limbs==='tentacle'){
    let o='';
    for(let i=0;i<4;i++){
      const x=b.l+b.w*(0.18+i*0.21);
      o+=`<path d="M${x} ${b.b-14} q ${i%2?9:-9} 14 ${i%2?5:-5} 20" stroke="${accent}" stroke-width="7" stroke-linecap="round" fill="none"/>`;
    }
    return o;
  }
  const y=b.b-9;
  const c=b.l+b.w/2;
  const spread = n===2?[c-14,c+14]
    : n===4?[c-21,c-7,c+7,c+21]
    : [c-26,c-15,c-5,c+5,c+15,c+26];
  let out='';
  for(const dx of spread){
    out+=`<rect x="${dx-4}" y="${y}" width="8" height="17" rx="4" fill="${dark}"/>`;
  }
  return out;
}

function tailFor(g,accent){
  if(g.tail==='none') return '';
  const x=bg(g).l+2, y=(g.body==='tall'?76:74);
  if(g.tail==='curl') return `<path d="M${x} ${y} q -20 -4 -17 -20 q 2 -11 12 -8" stroke="${accent}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
  if(g.tail==='spike') return `<path d="M${x} ${y-2} L${x-23} ${y-16} L${x-6} ${y+12} Z" fill="${accent}" stroke="${accent}" stroke-width="2" stroke-linejoin="round"/>`;
  return `<ellipse cx="${x-11}" cy="${y-6}" rx="13" ry="9" fill="${accent}"/><circle cx="${x-19}" cy="${y-14}" r="7" fill="${accent}"/>`;
}

function patternFor(g,accent,id){
  if(g.pattern==='none') return '';
  let inner='';
  if(g.pattern==='spots'){
    const pts=[[46,64,5],[68,58,4],[79,76,6],[52,86,4],[71,88,3],[37,80,3],[60,72,3]];
    inner=pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${p[2]}" fill="${accent}" opacity=".85"/>`).join('');
  } else if(g.pattern==='stripes'){
    inner=[0,1,2,3].map(i=>`<rect x="${38+i*14}" y="36" width="7" height="80" fill="${accent}" opacity=".85"/>`).join('');
  } else {
    for(let r=0;r<7;r++)for(let c=0;c<6;c++){
      if((r+c)%2===0) inner+=`<rect x="${28+c*15}" y="${34+r*12}" width="13" height="11" fill="${accent}" opacity=".5"/>`;
    }
  }
  return `<g clip-path="url(#cp${id})">${inner}</g>`;
}

function eyesFor(g,dark,white){
  const cy=31;
  const eye=(x,y,r)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${white}" stroke="${dark}" stroke-width="1.2"/>
    <circle cx="${x}" cy="${y+0.5}" r="${r*0.52}" fill="${dark}"/>
    <circle cx="${x-r*0.28}" cy="${y-r*0.3}" r="${r*0.22}" fill="#fff" opacity=".95"/>`;
  switch(g.eyes){
    case 'one':   return eye(60,cy,11);
    case 'two':   return eye(51,cy,7)+eye(69,cy,7);
    case 'three': return eye(46,cy+3,5)+eye(60,cy-2,6)+eye(74,cy+3,5);
    case 'big':   return eye(50,cy,9)+eye(70,cy,9);
    case 'stalk':
      return `<path d="M51 26 L46 14" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>
              <path d="M69 26 L74 14" stroke="${dark}" stroke-width="4" stroke-linecap="round"/>
              ${eye(46,12,6.5)}${eye(74,12,6.5)}`;
  }
  return '';
}

function hornsFor(g,accent){
  const hy=HEADTOP[g.head]||9;
  switch(g.horns){
    case 'none': return '';
    case 'two':
      return `<path d="M49 ${hy+7} L43 ${hy-7} L57 ${hy+3} Z" fill="${accent}"/>
              <path d="M71 ${hy+7} L77 ${hy-7} L63 ${hy+3} Z" fill="${accent}"/>`;
    case 'one':
      return `<path d="M60 ${hy+3} L53 ${hy-13} L67 ${hy-13} Z" fill="${accent}"/>`;
    case 'antlers':
      return `<path d="M50 ${hy+8} q -9 -13 -3 -20 M50 ${hy+8} q -13 -3 -17 1" stroke="${accent}" stroke-width="4" fill="none" stroke-linecap="round"/>
              <path d="M70 ${hy+8} q 9 -13 3 -20 M70 ${hy+8} q 13 -3 17 1" stroke="${accent}" stroke-width="4" fill="none" stroke-linecap="round"/>`;
  }
  return '';
}

function render(g,cls){
  const id=++cid;
  const p=PAL[((g.palette|0)+PAL.length)%PAL.length];
  const body=p[0], accent=p[1], dark=p[2];
  const outline=`stroke="${dark}" stroke-width="2"`;
  return `<svg viewBox="0 -18 120 126" class="${cls||''}" xmlns="http://www.w3.org/2000/svg">
    <defs><clipPath id="cp${id}">${bodyShape(g.body,'#000')}</clipPath></defs>
    ${tailFor(g,accent)}
    ${legsFor(g,accent,dark)}
    ${bodyShape(g.body,body,outline)}
    ${patternFor(g,accent,id)}
    ${headShape(g.head,body,dark)}
    ${hornsFor(g,accent)}
    ${eyesFor(g,dark,'#ffffff')}
  </svg>`;
}


/* ==================== STATS FROM TRAITS ==================== */
const BODYHP = {blob:22, tall:26, wide:32, bug:16, slug:20};
const BODYDEF = {blob:2, tall:1, wide:4, bug:1, slug:3};
const PATDEF = {none:0, spots:1, stripes:2, checker:3};
const LIMBATK = {none:1, two:2, four:3, six:4, tentacle:3};
const LIMBSPD = {none:0, two:2, four:3, six:4, tentacle:1};
const HORNATK = {none:0, two:2, one:3, antlers:4};
const TAILSPD = {none:0, curl:1, spike:2, bushy:1};
const EYESCRIT = {one:12, two:8, three:10, big:6, stalk:14};

const MOVES = {
  strike:  {name:'STRIKE'},
  guard:   {name:'GUARD'},
  charge:  {name:'GORE'},    // horns
  venom:   {name:'VENOM'},   // slug/pattern
  flurry:  {name:'FLURRY'},  // lots of limbs
  glare:   {name:'GLARE'},   // stalk eyes
  slam:    {name:'SLAM'},    // wide body
  web:     {name:'WEB'}      // bug
};

function statsOf(g){
  const hp = 34 + (BODYHP[g.body]||22) + (LIMBATK[g.limbs]||1)*2;
  const atk = 7 + (HORNATK[g.horns]||0) + (LIMBATK[g.limbs]||1);
  const def = (BODYDEF[g.body]||2) + (PATDEF[g.pattern]||0);
  const spd = 10 + (LIMBSPD[g.limbs]||0)*2 + (TAILSPD[g.tail]||0)*2;
  const crit = EYESCRIT[g.eyes]||8;
  return {hp, atk, def, spd, crit};
}

function specialOf(g){
  if(g.horns==='antlers'||g.horns==='one'||g.horns==='two') return 'charge';
  if(g.limbs==='tentacle'||g.limbs==='six') return 'flurry';
  if(g.eyes==='stalk') return 'glare';
  if(g.body==='wide') return 'slam';
  if(g.body==='slug') return 'venom';
  if(g.body==='bug') return 'web';
  if(g.pattern==='stripes'||g.pattern==='spots') return 'venom';
  return 'slam';
}

/* ==================== BATTLE ==================== */
const SAVE='mutantzoo.v1';
const bst={lv:1,wave:0,best:0};
let P=null, E=null, myGenome=null, busy=false, specCd=0;

function loadBeasts(){
  try{
    const raw=localStorage.getItem(SAVE);
    if(!raw) return [];
    const d=JSON.parse(raw);
    return (d.zoo||[]).filter(g=>g&&g.body);
  }catch(e){ return []; }
}

/* ==================== BALANCE ==================== */
/* These numbers are not vibes — they came out of a 12k-run simulation search.
   Target: a random first beast should clear wave 1 nearly always, median run
   about 13 waves, bad beasts dying around wave 5, great beasts going 25+. */
const BAL={
  atkScale:1.7,
  // player growth per level
  plHp:0.26, plAtk:0.18, plDef:0.50, lvPerWaves:2,
  healPerWave:0.22,
  // enemy growth
  enHpBase:0.45, enHpPerWave:0.17,
  enAtkBase:0.50, enAtkPerWave:0.085, enDefPerWave:0.16,
  bossHp:1.20, bossAtk:1.12,
  armour:0.13
};

/* the single source of truth for damage — used by the game AND the tests */
function resolveDamage(base, atk, def, critChance){
  const raw = base*atk/(1+def*0.9*BAL.armour);
  const varied = raw*(0.9+Math.random()*0.24);
  const crit = Math.random()*100 < critChance;
  return {dmg:Math.max(1,Math.round(crit?varied*1.85:varied)), crit};
}

/* enemies scale with wave, generated with the same genome */
function makeEnemy(wave){
  const g=newGenome();
  const tier=Math.floor(wave/6);
  const names=['Wild','Feral','Rogue','Titan','Elder','Ancient'];
  g.name=(names[Math.min(tier,5)]||'Wild')+' '+g.name;
  const st=statsOf(g);
  const boss=(wave%5===0);
  const hpMult=(BAL.enHpBase+wave*BAL.enHpPerWave)*(boss?BAL.bossHp:1);
  const atkMult=(BAL.enAtkBase+wave*BAL.enAtkPerWave)*(boss?BAL.bossAtk:1);
  const hp=Math.round(st.hp*hpMult);
  return {g, st:{hp, maxhp:hp,
      atk:st.atk*atkMult,
      def:st.def+(wave*BAL.enDefPerWave),
      spd:st.spd, crit:st.crit},
    special:specialOf(g), boss};
}

/* ==================== UI FLOW ==================== */
const $=id=>document.getElementById(id);
let picked=null, beasts=[];

function boot(){
  beasts=loadBeasts();
  bst.best=+(localStorage.getItem('bab.best')||0);
  $('hBest').textContent=bst.best;
  const grid=$('pickGrid');
  if(!beasts.length){
    grid.innerHTML='<div style="grid-column:1/-1;text-align:center;color:#9a90b8;font-size:13px;padding:30px 12px;line-height:1.7">No beasts found.<br>Go to <b>Mutant Zoo</b>, splice a couple, then come back here — your zoo is your army.</div>';
    $('btnGo').disabled=true;
    return;
  }
  grid.innerHTML='';
  beasts.forEach((g,i)=>{
    const d=document.createElement('div');
    d.className='pcard';
    d.innerHTML=render(g)+`<div class="nm">${esc(g.name)}</div>`;
    d.onclick=()=>{
      picked=i;
      [...grid.children].forEach(c=>c.classList.remove('sel'));
      d.classList.add('sel');
      $('btnGo').disabled=false;
      $('btnGo').textContent='FIGHT AS '+g.name.toUpperCase();
      beep(520,.05);
    };
    grid.appendChild(d);
  });
}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

$('btnGo').onclick=()=>{
  if(picked==null) return;
  myGenome=beasts[picked];
  bst.wave=1; bst.lv=1;
  $('scrPick').classList.remove('on');
  $('arena').classList.add('on');
  startWave(true);
};

function startWave(fresh){
  const st=statsOf(myGenome);
  const k=bst.lv-1;
  const myMax=Math.round(st.hp*(1+k*BAL.plHp));
  if(fresh||!P||P.maxhp!==myMax){
    P={hp:myMax,maxhp:myMax,
       atk:st.atk*BAL.atkScale*(1+k*BAL.plAtk),
       def:st.def+k*BAL.plDef,
       spd:st.spd,crit:st.crit,
       special:specialOf(myGenome),name:myGenome.name};
  }
  E=makeEnemy(bst.wave);
  specCd=0;
  $('svgL').innerHTML=render(myGenome);
  $('svgR').innerHTML=render(E.g);
  $('nameL').textContent=P.name;
  $('nameR').textContent=E.g.name;
  $('hWave').textContent=bst.wave;
  $('log').innerHTML='';
  log(`<span class="dim">Wave ${bst.wave}${E.boss?' — BOSS':''}. ${esc(E.g.name)} appears.</span>`);
  if(E.boss) log('<span class="crit">⚠ Boss beasts hit harder and heal between waves.</span>');
  updateBars();
  busy=false;
  refreshMoves();
}

function refreshMoves(){
  const spec=MOVES[P.special]||MOVES.strike;
  $('mvSpecial').innerHTML=spec.name+'<small>'+(specCd>0?'ready in '+specCd:'ready')+'</small>';
  $('mvSpecial').disabled=busy||specCd>0;
  $('mvStrike').disabled=busy;
  $('mvGuard').disabled=busy;
}

function updateBars(){
  const lp=Math.max(0,P.hp/P.maxhp*100), rp=Math.max(0,E.st.hp/E.st.maxhp*100);
  $('hpL').style.width=lp+'%'; $('hpR').style.width=rp+'%';
  $('hpL').className='hpbar'+(lp<28?' low':'');
  $('hpR').className='hpbar'+(rp<28?' low':'');
  $('hpTxtL').textContent=Math.max(0,Math.round(P.hp))+' / '+P.maxhp;
  $('hpTxtR').textContent=Math.max(0,Math.round(E.st.hp))+' / '+E.st.maxhp;
}

function log(html){
  const d=document.createElement('div');
  d.innerHTML=html;
  $('log').appendChild(d);
  $('log').scrollTop=$('log').scrollHeight;
}

function anim(which,cls){
  const el=$(which);
  el.classList.remove('hit','atk-l','atk-r','ko');
  void el.offsetWidth;
  el.classList.add(cls);
  setTimeout(()=>el.classList.remove(cls),340);
}

const roll=resolveDamage;

/* ---------- player move ---------- */
function playerMove(kind){
  if(busy||P.hp<=0||E.st.hp<=0) return;
  busy=true; refreshMoves();
  let base=1.0, note='', self=false;

  if(kind==='guard'){
    const heal=Math.round(P.maxhp*0.15);
    P.hp=Math.min(P.maxhp,P.hp+heal);
    updateBars();
    log(`<span class="good">${esc(P.name)} braces and recovers ${heal} HP.</span>`);
    endPlayerTurn(0.55,0.5);
    return;
  }

  if(kind==='special'){
    specCd=4;
    switch(P.special){
      case 'charge': base=1.9; note='gores with horns'; break;
      case 'flurry': base=1.6; note='unleashes a flurry'; break;
      case 'glare':  base=1.3; note='glares — enemy defence drops'; E.st.def=Math.max(0,E.st.def-3); break;
      case 'slam':   base=1.8; note='slams down hard'; break;
      case 'venom':  base=1.2; note='injects venom'; self=true; break;
      case 'web':    base=1.1; note='webs the enemy — it slows'; E.st.spd*=0.6; break;
      default:       base=1.6; note='attacks';
    }
  } else {
    base=1.0; note='strikes';
  }

  anim('fL','atk-r');
  setTimeout(()=>{
    const r=roll(base,P.atk,E.st.def,P.crit);
    E.st.hp-=r.dmg;
    anim('fR','hit');
    log(`<span class="${r.crit?'crit':'dmg'}">${esc(P.name)} ${note}${r.crit?' — CRITICAL':''} for ${r.dmg}.</span>`);
    if(self){
      const dot=Math.round(r.dmg*0.45);
      E.dot=(E.dot||0)+dot;
      log(`<span class="good">Venom: ${dot} extra damage each turn.</span>`);
      E.st.hp-=dot;
    }
    beep(r.crit?880:300,.06);
    updateBars();
    if(E.st.hp<=0){ win(); return; }
    endPlayerTurn(0.85,1);
  },180);
}

function endPlayerTurn(myDur,enemyDelay){
  setTimeout(()=>{
    if(specCd>0){ specCd--; }
    if(E.st.hp<=0){ win(); return; }
    // enemy turn
    enemyMove();
  }, 620*enemyDelay);
}

function enemyMove(){
  const e=E;
  anim('fR','atk-l');
  setTimeout(()=>{
    if(E.dot){
      E.st.hp-=E.dot;
      log(`<span class="good">Venom burns ${E.dot}.</span>`);
      updateBars();
      if(E.st.hp<=0){ win(); return; }
    }
    // pick move
    let base=1.0, note='strikes';
    if(e.st.hp/e.st.maxhp<0.3&&Math.random()<0.3){
      const heal=Math.round(e.st.maxhp*0.12);
      e.st.hp=Math.min(e.st.maxhp,e.st.hp+heal);
      log(`<span class="dim">${esc(e.g.name)} recovers ${heal}.</span>`);
      updateBars();
      busy=false; refreshMoves(); return;
    }
    if(e.boss&&Math.random()<0.3){ base=1.7; note='roars and crushes'; }
    else if(Math.random()<0.25){ base=1.45; note='winds up and hits'; }
    const r=roll(base,e.st.atk,P.def,e.st.crit);
    P.hp-=r.dmg;
    anim('fL','hit');
    log(`<span class="${r.crit?'crit':'dmg'}">${esc(e.g.name)} ${note}${r.crit?' — CRITICAL':''} for ${r.dmg}.</span>`);
    beep(r.crit?700:220,.06);
    updateBars();
    if(P.hp<=0){ lose(); return; }
    busy=false; refreshMoves();
  },200);
}

function win(){
  busy=true; refreshMoves();
  anim('fR','ko');
  const heal=Math.round(P.maxhp*BAL.healPerWave);
  P.hp=Math.min(P.maxhp,P.hp+heal);
  bst.wave++;
  if(bst.wave>bst.best){ bst.best=bst.wave; localStorage.setItem('bab.best',bst.best); $('hBest').textContent=bst.best; }
  if(bst.wave%BAL.lvPerWaves===0){ bst.lv++; }
  const xpMsg = bst.wave%BAL.lvPerWaves===0? ` You reached <b>level ${bst.lv}</b> — stronger.`:'';
  showResult('WAVE CLEARED', `${esc(E.g.name)} goes down. Recovered ${heal} HP.${xpMsg}`, ()=>{
    startWave(false);
    P.hp=Math.min(P.maxhp,P.hp);
  });
}

function lose(){
  busy=true; refreshMoves();
  anim('fL','ko');
  showResult('YOU LOST', `${esc(E.g.name)} won this one. You made wave ${bst.wave}.`, ()=>{
    $('arena').classList.remove('on');
    $('scrPick').classList.add('on');
    boot();
    picked=null;
    $('btnGo').disabled=true;
    $('btnGo').textContent='ENTER THE ARENA';
  });
}

let ovCb=null;
function showResult(t,x,cb){
  $('ovTitle').textContent=t;
  $('ovText').innerHTML=x;
  $('ovResult').classList.add('on');
  ovCb=cb;
  beep(t==='WAVE CLEARED'?700:140,.12);
  if(t==='WAVE CLEARED') setTimeout(()=>beep(1000,.14),130);
}
$('ovNext').onclick=()=>{
  $('ovResult').classList.remove('on');
  const c=ovCb; ovCb=null;
  if(c) c();
};

$('mvStrike').onclick=()=>playerMove('strike');
$('mvGuard').onclick=()=>playerMove('guard');
$('mvSpecial').onclick=()=>playerMove('special');

/* ---------- audio ---------- */
let actx=null;
function beep(freq,dur){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type='square'; o.frequency.value=freq;
    g.gain.setValueAtTime(.04,actx.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime+dur);
  }catch(e){}
}

boot();
window.__bab={get P(){return P}, get E(){return E}, statsOf, specialOf, makeEnemy, startWave, playerMove,
  setPicked:i=>{picked=i}, get beasts(){return beasts}, boot, bst, BAL, resolveDamage};
</script>
</body>
</html>
